name: Discord Loop Inactive Upload Once
on:
  push:
    branches: [main]
    paths:
      - 'preflight/loop-inactive-upload.once'
permissions:
  contents: read
concurrency:
  group: discord-relay-version-upload
  cancel-in-progress: false
jobs:
  upload:
    if: ${{ github.event.head_commit.message == 'Trigger one-time Discord loop inactive upload' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact Cloudflare scope, Worker and new D1
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || exit 1
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.loop.toml || exit 1
          grep -Fxq 'main = "worker-loop.mjs"' wrangler.loop.toml || exit 1
          grep -Fxq 'database_name = "discord-relay-loop-state"' wrangler.loop.toml || exit 1
          grep -Fxq 'database_id = "d80b08a4-0ff7-4320-9575-0d3c55cf7aba"' wrangler.loop.toml || exit 1
          grep -Fxq 'keep_vars = true' wrangler.loop.toml || exit 1
          grep -Fxq 'binding = "AI"' wrangler.loop.toml || exit 1
      - name: Ensure live baseline has not changed since secret verification
        run: |
          npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab > /tmp/discord-loop-before-upload.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/discord-loop-before-upload.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const versions=[...raw.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(m=>m[1]);
          if(versions.at(-1)!=='b1b421c3-23fe-4a55-b8a7-db72b36848cc')
            throw Error('The live Worker changed since owner-secret probe: STOP, no candidate upload.');
          console.log('Expected existing Discord Worker verified');
          NODE
      - name: Test all existing slash commands and bounded-loop code offline
        run: |
          node --test relay.test.mjs worker-relay.test.mjs loop-core.test.mjs loop-worker.test.mjs loop-state.test.mjs loop-d1.test.mjs worker-loop.test.mjs
      - name: Compile only
        run: |
          npx --yes wrangler@4 deploy --dry-run --config wrangler.loop.toml --outdir /tmp/discord-loop-candidate
      - name: Upload new INACTIVE version; do not deploy or change Cron
        run: |
          npx --yes wrangler@4 versions upload --config wrangler.loop.toml --message "Isolated Discord A-B-A-B loop candidate; NOT live"
      - name: Finish, leave existing production and cron untouched
        run: |
          echo 'INACTIVE_UPLOAD_COMPLETE. No production traffic or triggers changed.'
