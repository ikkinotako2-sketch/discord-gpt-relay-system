name: GPT OSS Preview Health Read Only Once
on:
  push:
    branches: [main]
    paths:
      - 'preflight/gpt-oss-preview-health.once'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.head_commit.message == 'Verify GPT OSS inactive preview without inference' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify non-inference preview health and signature enforcement
        run: |
          node --input-type=module <<'NODE'
          const preview='https://64b48d3f-steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          const production='https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          const test=async (url) => {
            const get=await fetch(url,{signal:AbortSignal.timeout(12000)});
            const body=await get.text();
            const unsigned=await fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(12000)});
            return {code:get.status,body:body.trim(),unsignedPost:unsigned.status};
          };
          const [candidate, live]=await Promise.all([test(preview),test(production)]);
          const candidateOK=candidate.code===200 &&
            candidate.body==='Discord GPT Relay gpt-oss pilot ready.' && candidate.unsignedPost===401;
          const liveOK=live.code===200 &&
            live.body==='Discord GPT Relay loop-v2 task-focus ready.' && live.unsignedPost===401;
          console.log(JSON.stringify({candidateStatus:candidate.code,candidateExpectedVersion:candidate.body==='Discord GPT Relay gpt-oss pilot ready.',
            candidateSignatureGate:candidate.unsignedPost,liveStatus:live.code,
            liveOriginalModel:live.body==='Discord GPT Relay loop-v2 task-focus ready.',
            liveSignatureGate:live.unsignedPost}));
          if(!candidateOK || !liveOK)throw Error('Preview/production mismatch. No model inference or deployment attempted.');
          console.log('READ_ONLY_PREVIEW_PASS. Candidate GPT-OSS binding and D1 ready; production still Llama.');
          NODE
