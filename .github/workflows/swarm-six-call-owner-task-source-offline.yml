name: Discord Six-Call Original Owner Task D1 OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-owner-task-source.review.sql'
      - 'swarm/smoke-six-call-owner-task-source.mjs'
      - 'swarm/smoke-six-call-owner-task-source.test.mjs'
      - 'swarm/SMOKE_SIX_CALL_OWNER_TASK_READINESS.md'
      - 'swarm/verify-isolation.mjs'
      - '.github/workflows/swarm-six-call-owner-task-source-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Strict six-file read-only scoped diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/owner-task-changed.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const allow=new Set([
            'swarm/smoke-six-call-owner-task-source.review.sql',
            'swarm/smoke-six-call-owner-task-source.mjs',
            'swarm/smoke-six-call-owner-task-source.test.mjs',
            'swarm/SMOKE_SIX_CALL_OWNER_TASK_READINESS.md',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-six-call-owner-task-source-offline.yml'
          ]);
          const paths=readFileSync('/tmp/owner-task-changed.txt','utf8').trim().split('\n');
          if(paths.length!==6||new Set(paths).size!==6||paths.some(x=>!allow.has(x)))
            throw Error('OWNER_TASK_CHANGE_SCOPE_NOT_REVIEWED');
          console.log('OWNER_TASK_EXACT_SIX_FILE_ISOLATION_PASS');
          NODE
      - name: Six-stage owner task SQLite+fake GPT OSS integration
        run: |
          node --check swarm/smoke-six-call-owner-task-source.mjs
          node --check swarm/smoke-six-call-owner-task-source.test.mjs
          node --test swarm/smoke-six-call-owner-task-source.test.mjs \
            swarm/smoke-six-call-provider-adapter.test.mjs \
            swarm/smoke-six-call-output-d1.test.mjs \
            swarm/smoke-six-call-postclaim-stop.test.mjs \
            swarm/smoke-six-call-migration-acceptance.test.mjs
      - name: No live Worker imports, D1 migrations or model runs
        run: |
          ! grep -R "smoke-six-call-owner-task-source" worker-relay.mjs worker-loop.mjs swarm/cron.mjs swarm/runner.mjs
          echo 'OWNER_TASK_SQL_OFFLINE_ONLY_SAFE'
