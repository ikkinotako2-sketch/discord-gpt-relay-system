name: Discord Scoped Watchdog Restore Secret Once
on:
  push:
    branches: [deploy/discord-watchdog-parked-20261015]
    paths: ['.github/workflows/discord-watchdog-scoped-restore-secret-once.yml']
permissions:
  contents: read
concurrency:
  group: discord-independent-watchdog-secret-once
  cancel-in-progress: false
jobs:
  scoped-secret-only:
    if: ${{ github.event.head_commit.message == 'Bind verified scoped Discord restorer to parked watchdog once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_RESTORE_TOKEN: ${{ secrets.WATCHDOG_RESTORE_TOKEN }}
      DISCORD_D1_READ_TOKEN: ${{ secrets.DISCORD_D1_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on scope, secrets, OFF, healthy primary and zero D1 jobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ikkinotako2-sketch/discord-gpt-relay-system'
          test "$GITHUB_REF" = 'refs/heads/deploy/discord-watchdog-parked-20261015'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$WATCHDOG_RESTORE_TOKEN"
          test -n "$DISCORD_D1_READ_TOKEN"
          node --input-type=module <<'NODE'
          import {createDiscordD1ReadClient} from './swarm/smoke-watchdog-d1.mjs';
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/';
          const primary='steep-glitter-b5cddiscord-ai-relay-lab';
          const watchdog='discord-smoke-independent-watchdog-staged';
          async function get(worker,suffix,token){
            const res=await fetch(base+worker+suffix,{method:'GET',headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
            if(res.status!==200)throw Error('SCOPE_BLOCKED_'+worker+'_'+suffix+'_HTTP_'+res.status);
            const obj=await res.json();
            if(obj.success!==true||!obj.result)throw Error('CLOUDFLARE_RESULT_UNVERIFIED');
            return obj.result;
          }
          const narrow=process.env.WATCHDOG_RESTORE_TOKEN;
          const [settings,deployment,versionList]=await Promise.all([
            get(primary,'/settings',narrow),
            get(primary,'/deployments',narrow),
            get(primary,'/versions',narrow)
          ]);
          if(!Array.isArray(settings?.bindings)||!Array.isArray(deployment?.deployments)||
             !deployment.deployments.length||!versionList)throw Error('PRIMARY_SCOPE_READ_UNVERIFIED');
          for(const suffix of ['/settings','/deployments']){
            const r=await fetch(base+watchdog+suffix,{method:'GET',headers:{Authorization:'Bearer '+narrow},signal:AbortSignal.timeout(12000)});
            if(![401,403].includes(r.status))throw Error('SCOPED_TOKEN_CAN_ACCESS_ANOTHER_WORKER_'+suffix);
          }
          const broad=process.env.CLOUDFLARE_API_TOKEN;
          const [parked,secrets,schedules]=await Promise.all([
            get(watchdog,'/settings',broad),
            get(watchdog,'/secrets',broad),
            get(watchdog,'/schedules',broad)
          ]);
          if(!Array.isArray(parked?.bindings)||!Array.isArray(secrets)||
             !Array.isArray(schedules?.schedules)||schedules.schedules.length!==1||
             schedules.schedules[0].cron!=='* * * * *')throw Error('WATCHDOG_REMOTE_NOT_VERIFIED');
          function one(k,v){
            const found=parked.bindings.filter(x=>x?.name===k);
            if(found.length!==1||found[0].type!=='plain_text'||found[0].text!==v)
              throw Error('PARKED_NOT_OFF_'+k);
          }
          for(const [k,v] of [
            ['WATCHDOG_ARMED','false'],['WATCHDOG_APPROVAL','NOT_APPROVED'],
            ['WATCHDOG_BASELINE_VERSION','UNSET'],['WATCHDOG_SMOKE_VERSION','UNSET'],
            ['WATCHDOG_EXPECTED_DEPLOYMENT_ID','UNSET'],['WATCHDOG_EXPIRES_AT','UNSET']
          ])one(k,v);
          if(secrets.some(x=>x?.name==='WATCHDOG_RESTORE_TOKEN')||
             secrets.filter(x=>x?.name==='WATCHDOG_D1_READ_TOKEN').length!==1)
            throw Error('WATCHDOG_SECRET_SET_UNEXPECTED');
          for(const k of ['SWARM_API_ENABLED','SWARM_RUNNER_ENABLED','SWARM_EXECUTION_APPROVED','SWARM_EXCLUSIVE_MODE']){
            const found=settings.bindings.filter(x=>x?.name===k);
            if(found.length>1||(found.length===1&&(found[0].type!=='plain_text'||found[0].text!=='false')))
              throw Error('PRIMARY_FLAGS_NOT_OFF_'+k);
          }
          const snap=await createDiscordD1ReadClient({token:process.env.DISCORD_D1_READ_TOKEN}).snapshot();
          if(!snap.clean)throw Error('D1_DISCORD_HAS_ACTIVE_OR_UNKNOWN_JOBS');
          const url='https://'+primary+'.ikkinotako2.workers.dev/';
          const [health,signature]=await Promise.all([fetch(url,{signal:AbortSignal.timeout(12000)}),
            fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(12000)})]);
          if(health.status!==200||signature.status!==401||
             (await health.text()).trim()!=='Discord GPT Relay gpt-oss command-center ready.')
            throw Error('DISCORD_PRIMARY_HEALTH_OR_SIGNATURE_FAILED');
          console.log('NARROW_RESTORER_SCOPE_AND_NEGATIVE_CONTROL_PASS');
          console.log('PARKED_WATCHDOG_OFF_HEALTH_D1_CLEAN_PASS');
          NODE
      - name: Inject narrow token only to parked standalone Watchdog
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WATCHDOG_RESTORE_TOKEN" | npx --yes wrangler@4.119.0 secret put WATCHDOG_RESTORE_TOKEN --name discord-smoke-independent-watchdog-staged --config swarm/wrangler.watchdog.example.toml
      - name: Verify dedicated secret names and unchanged Watchdog OFF flags
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/6c8ccd6aface937ab5dabef61cb64534/workers/scripts/discord-smoke-independent-watchdog-staged';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function get(suffix){
            const r=await fetch(base+suffix,{headers,signal:AbortSignal.timeout(12000)});
            if(r.status!==200)throw Error('POSTCHECK_HTTP_'+r.status);
            const d=await r.json();
            if(d.success!==true||!d.result)throw Error('POSTCHECK_NOT_VERIFIED');
            return d.result;
          }
          const [secrets,settings,schedules]=await Promise.all([get('/secrets'),get('/settings'),get('/schedules')]);
          if(!Array.isArray(secrets)||!Array.isArray(settings?.bindings)||
             !Array.isArray(schedules?.schedules))throw Error('POSTCHECK_MALFORMED');
          for(const k of ['WATCHDOG_RESTORE_TOKEN','WATCHDOG_D1_READ_TOKEN']){
            if(secrets.filter(x=>x?.name===k).length!==1)throw Error('SCOPED_SECRET_MISSING_'+k);
          }
          for(const [k,v] of [['WATCHDOG_ARMED','false'],['WATCHDOG_APPROVAL','NOT_APPROVED'],
            ['WATCHDOG_BASELINE_VERSION','UNSET'],['WATCHDOG_SMOKE_VERSION','UNSET'],
            ['WATCHDOG_EXPECTED_DEPLOYMENT_ID','UNSET'],['WATCHDOG_EXPIRES_AT','UNSET']]){
            const xs=settings.bindings.filter(x=>x?.name===k);
            if(xs.length!==1||xs[0].type!=='plain_text'||xs[0].text!==v)
              throw Error('WATCHDOG_UNEXPECTED_CONFIG_'+k);
          }
          if(schedules.schedules.length!==1||schedules.schedules[0].cron!=='* * * * *')
            throw Error('WATCHDOG_CRON_CHANGED');
          console.log('DISCORD_WATCHDOG_BOTH_SECRETS_PRESENT_PARKED_OFF');
          console.log('NO_PRIMARY_WORKER_WRITE_NO_AI_NO_D1_WRITE');
          NODE
