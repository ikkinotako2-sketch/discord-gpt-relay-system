name: Discord Six-Call STOP and Recovery OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-d1-schema.review.sql'
      - 'swarm/smoke-six-call-d1-store.mjs'
      - 'swarm/smoke-six-call-controller.mjs'
      - 'swarm/smoke-six-call-reconcile.mjs'
      - 'swarm/smoke-six-call-stop-reconcile.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_SAFE_STOP_STATUS.md'
      - '.github/workflows/swarm-six-call-safe-stop-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exactly eight safely scoped source changes
        run: node swarm/verify-isolation.mjs
      - name: Syntax checks
        run: |
          node --check swarm/smoke-six-call-controller.mjs
          node --check swarm/smoke-six-call-d1-store.mjs
          node --check swarm/smoke-six-call-reconcile.mjs
          node --check swarm/smoke-six-call-stop-reconcile.test.mjs
      - name: Fault-injection and legacy regression tests using local SQLite only
        run: |
          node --test swarm/smoke-six-call-stop-reconcile.test.mjs \
            swarm/smoke-six-call-controller.test.mjs \
            swarm/smoke-six-call-d1-store.test.mjs \
            swarm/smoke-six-call-owner-prepare.test.mjs \
            swarm/smoke-one-shot-offline-simulator.test.mjs
      - name: No live connections, real AI calls, or schema migration
        run: |
          ! grep -R -E "smoke-six-call-reconcile|smoke-six-call-stop-reconcile" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'SAFE_STOP_AND_WATCHDOG_RECONCILE_OFFLINE_ONLY'
