name: Discord Swarm Disabled Release Readiness (READ ONLY)
on:
  push:
    branches: [diagnostics/discord-swarm-disabled-release-gate-20261012]
    paths: ['.github/workflows/discord-swarm-disabled-release-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.event.head_commit.message == 'Verify isolated six-agent disabled-state release once read only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_D1_READ_TOKEN: ${{ secrets.DISCORD_D1_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '6c8ccd6aface937ab5dabef61cb64534'
      WORKER_NAME: 'steep-glitter-b5cddiscord-ai-relay-lab'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact Discord resources, no environment mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ikkinotako2-sketch/discord-gpt-relay-system'
          test "$GITHUB_REF" = 'refs/heads/diagnostics/discord-swarm-disabled-release-gate-20261012'
          test -n "$CF_WORKER_TOKEN"
          test -n "$CF_D1_READ_TOKEN"
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.command-center.toml
          grep -Fxq 'database_name = "discord-relay-loop-state"' wrangler.command-center.toml
          grep -Fxq 'database_id = "d80b08a4-0ff7-4320-9575-0d3c55cf7aba"' wrangler.command-center.toml
          test "$(git hash-object swarm/schema.sql)" = '8aa4dd566b1af37b609fe715d4c59b4517ddeced'
          if grep -E '^SWARM_(API_ENABLED|RUNNER_ENABLED|EXECUTION_APPROVED|EXCLUSIVE_MODE)[[:space:]]*=' wrangler.command-center.toml; then
            echo 'BLOCKED_SWARM_FLAG_IN_CANDIDATE_CONFIG'; exit 1
          fi
          node --test swarm/schema-readiness.test.mjs
          node --test swarm/bridge.test.mjs
      - name: Verify live Worker flags absent or exactly false via Worker settings GET (read only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const script='steep-glitter-b5cddiscord-ai-relay-lab';
          const token=process.env.CF_WORKER_TOKEN;
          const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+script+'/settings',{
            headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(18000)
          });
          if(res.status!==200)throw Error('BLOCKED_REMOTE_WORKER_SETTINGS_UNAVAILABLE_'+res.status);
          const raw=await res.json();
          if(raw.success!==true || !Array.isArray(raw.result?.bindings))throw Error('BLOCKED_REMOTE_SETTINGS_NOT_VERIFIED');
          const names=['SWARM_API_ENABLED','SWARM_RUNNER_ENABLED','SWARM_EXECUTION_APPROVED','SWARM_EXCLUSIVE_MODE'];
          for(const name of names){
            const matches=raw.result.bindings.filter(b=>b?.name===name);
            if(matches.length>1)throw Error('BLOCKED_DUPLICATE_FLAG_'+name);
            if(matches.length===1 && !(matches[0].type==='plain_text' && matches[0].text==='false'))
              throw Error('BLOCKED_FLAG_NOT_EXPLICITLY_OFF_'+name);
            console.log('REMOTE_'+name+'='+(matches.length?'EXPLICIT_FALSE':'ABSENT'));
          }
          const required=['AI','LOOP_DB','DISCORD_PUBLIC_KEY','DISCORD_ALLOWED_USER_ID','DISCORD_OAUTH_CLIENT_SECRET','DASHBOARD_COOKIE_KEY'];
          for(const name of required)if(!raw.result.bindings.some(b=>b?.name===name))
            throw Error('BLOCKED_REQUIRED_BINDING_MISSING_'+name);
          console.log('REMOTE_DISABLED_FLAGS_VERIFIED; existing owner secrets not printed');
          NODE
      - name: Verify legacy and swarm D1 empty and schema objects present (read only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DISCORD_D1_READ_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute discord-relay-loop-state --remote --config wrangler.command-center.toml --json --command "SELECT (SELECT COUNT(*) FROM relay_loop_jobs WHERE status IN ('queued','claimed') OR active_slot=1) AS legacy_active,(SELECT COUNT(*) FROM swarm_jobs WHERE active_slot=1 OR status IN ('queued','claimed','quota_wait')) AS swarm_active,(SELECT COUNT(*) FROM swarm_jobs) AS swarm_total,(SELECT COUNT(*) FROM swarm_budget_days) AS budget_total;" > /tmp/discord-counts.json
          npx --yes wrangler@4 d1 execute discord-relay-loop-state --remote --config wrangler.command-center.toml --json --command "SELECT name,type FROM sqlite_master WHERE name IN ('swarm_jobs','swarm_budget_days','swarm_single_active_job','swarm_owner_created') ORDER BY name;" > /tmp/discord-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function rows(file){
            const raw=JSON.parse(fs.readFileSync(file,'utf8'));
            if(!Array.isArray(raw)||raw.length!==1||raw[0]?.success!==true||!Array.isArray(raw[0]?.results))throw Error('BLOCKED_D1_RESPONSE_INVALID');
            return raw[0].results;
          }
          const counts=rows('/tmp/discord-counts.json')[0];
          if(!counts||!['legacy_active','swarm_active','swarm_total','budget_total'].every(k=>Number.isSafeInteger(counts[k])&&counts[k]===0))
            throw Error('BLOCKED_D1_NONZERO_OR_INVALID');
          const names=rows('/tmp/discord-schema.json');
          const expected=['swarm_budget_days:table','swarm_jobs:table','swarm_owner_created:index','swarm_single_active_job:index'];
          if(JSON.stringify(names.map(x=>x.name+':'+x.type))!==JSON.stringify(expected))
            throw Error('BLOCKED_SWARM_SCHEMA_MISMATCH');
          console.log('D1_READONLY_READY: legacy_active=0 swarm_active=0 swarm_total=0 budget_total=0; objects=4');
          NODE
      - name: Verify existing signed Worker marker and record known rollback version (read only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          const [get,post]=await Promise.all([fetch(base,{signal:AbortSignal.timeout(12000)}),fetch(base,{method:'POST',body:'{}',signal:AbortSignal.timeout(12000)})]);
          if(get.status!==200||(await get.text()).trim()!=='Discord GPT Relay gpt-oss command-center ready.'||post.status!==401)
            throw Error('BLOCKED_EXISTING_DISCORD_WORKER_HEALTH_OR_SIGNATURE');
          console.log('LIVE_WORKER_AND_DISCORD_SIGNATURE_PASS');
          NODE
          npx --yes wrangler@4 deployments list --name "$WORKER_NAME" > /tmp/discord-deployments-before.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('/tmp/discord-deployments-before.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const versions=[...text.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          if(!versions.length)throw Error('BLOCKED_ROLLBACK_VERSION_UNKNOWN');
          console.log('ROLLBACK_VERSION_CAPTURED_FORMAT_VALID; no version change');
          NODE
      - name: Probe exact independent watchdog deployment presence (GET only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const worker='discord-smoke-independent-watchdog-staged';
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker+'/deployments';
          const token=process.env.CF_WORKER_TOKEN;
          if(!token)throw Error('READ_TOKEN_UNAVAILABLE');
          const res=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
          if(res.status===404){
            console.log('INDEPENDENT_WATCHDOG_LIVE=ABSENT; no deployment performed');
          }else if(res.status===200){
            const obj=await res.json();
            if(obj.success!==true||!Array.isArray(obj.result?.deployments))throw Error('WATCHDOG_REMOTE_RESPONSE_UNKNOWN');
            console.log(obj.result.deployments.length>0?'INDEPENDENT_WATCHDOG_LIVE=PRESENT_NOT_VERIFIED':'INDEPENDENT_WATCHDOG_LIVE=NO_ACTIVE_DEPLOYMENT');
          }else{
            console.log('INDEPENDENT_WATCHDOG_LIVE=UNVERIFIED_HTTP_'+res.status);
          }
          console.log('WATCHDOG_PROBE_READ_ONLY_NO_CLOUDFLARE_MUTATION');
          NODE
      - name: Count account-wide Cron triggers to assess Free slot (GET only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CF_WORKER_TOKEN;
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts';
          async function get(url){
            const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
            if(r.status!==200)throw Error('READ_UNVERIFIED_HTTP_'+r.status);
            const data=await r.json();
            if(data.success!==true)return null;
            return data;
          }
          try{
            const list=await get(root);
            const scripts=list?.result;
            if(!Array.isArray(scripts)||scripts.length>50||
               (Number.isSafeInteger(list?.result_info?.total_count)&&
                list.result_info.total_count!==scripts.length))throw Error('LIST_INCOMPLETE');
            let count=0;
            for(const worker of scripts){
              if(typeof worker.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(worker.id))
                throw Error('INVALID_SCRIPT_NAME');
              const response=await get(root+'/'+encodeURIComponent(worker.id)+'/schedules');
              if(!Array.isArray(response?.result?.schedules))throw Error('SCHEDULES_UNVERIFIED');
              count+=response.result.schedules.length;
            }
            console.log('ACCOUNT_CRON_TRIGGER_COUNT='+count);
            console.log('FREE_CRON_SPARE_SLOT_SNAPSHOT='+(count<5?'YES_NOT_RESERVED':'NO'));
          }catch{
            console.log('ACCOUNT_CRON_TRIGGER_COUNT=UNVERIFIED');
            console.log('FREE_CRON_SPARE_SLOT_SNAPSHOT=UNKNOWN');
          }
          console.log('ACCOUNT_SCHEDULE_METADATA_GET_ONLY_NO_DEPLOY');
          NODE
      - name: Verify no model calls, D1 writes, deployment, or secrets changes
        run: echo 'READ_ONLY_RELEASE_PREFLIGHT_COMPLETE_NO_DEPLOY_NO_MODEL_INFERENCE_NO_D1_WRITE_NO_SECRET_CHANGE'
# 2026-10-12 owner-approved six-agent 1-cycle smoke preflight recheck; READ ONLY; no execution or flags.
# PR8 final owner-approved one-time release preflight, read-only, 2026-10-13 Japan; expected code HEAD 2e5a39c27ed3c229ee76a013c941f2dcd46d2725.
# PR8 owner-only post-deploy verification 2026-10-13 JST; expected published main b013829022a69d0af770d2d1a3e0ae23422539b3. READ ONLY.
# Read-only follow-up after PR8 live rollout, 2026-10-13 JST; confirm flags 0 and job 0; no mutation.
# Read-only readiness recheck for 2026-10-14 after PR #8 one-shot release; no AI, DB writes or remote mutations.

# 2026-10-15 renewed Discord-only production read-only audit after merging PR 9-12; no deploy, mutation, inference, or cross-project access.
# 2026-10-15 exact isolated watchdog deployment presence GET-only check; no workflow activation or cloud mutation.
# 2026-10-15 exact account-wide Cron count read-only; no other Worker change and no secret output.

# 2026-10-22 independent safe state audit after parked Watchdog token binding.
