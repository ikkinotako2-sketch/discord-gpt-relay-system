name: Loop Candidate Upload (Manual, No Live Change)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discord-relay-version-upload
  cancel-in-progress: false
jobs:
  inactive_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated D1 configuration and account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || { echo 'Wrong Cloudflare account'; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('wrangler.loop.toml','utf8');
          const checks=[
            'name = "steep-glitter-b5cddiscord-ai-relay-lab"',
            'main = "worker-loop.mjs"',
            'database_name = "discord-relay-loop-state"',
            'binding = "LOOP_DB"',
            'keep_vars = true',
            'DISCORD_ALLOWED_USER_ID',
          ];
          for(const x of checks)if(!s.includes(x))throw Error('Unsafe or incomplete config');
          const match=s.match(/^database_id = "([^"]+)"$/m);
          if(!match||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(match[1]))
            throw Error('Dedicated D1 ID is not configured; do not upload');
          console.log('Configured Discord-only D1 UUID:',match[1]);
          NODE
      - name: All offline tests
        run: node --test relay.test.mjs worker-relay.test.mjs loop-core.test.mjs loop-worker.test.mjs loop-state.test.mjs loop-d1.test.mjs worker-loop.test.mjs
      - name: Build only
        run: npx --yes wrangler@4 deploy --config wrangler.loop.toml --dry-run --outdir /tmp/discord-loop
      - name: Upload inactive candidate only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 versions upload --config wrangler.loop.toml --message "Discord loop staged; not deployed"
      - name: Stop after inactive upload
        run: echo 'No traffic, Cron trigger, or Discord command was changed. Copy the Worker Version ID from logs.'
