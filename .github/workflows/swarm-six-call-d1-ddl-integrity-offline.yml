name: Discord Six-Call D1 DDL Hash Integrity OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-d1-ddl-digest.mjs'
      - 'swarm/smoke-six-call-d1-ddl-digest.test.mjs'
      - 'swarm/smoke-six-call-d1-readonly-audit.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_D1_DDL_INTEGRITY.md'
      - '.github/workflows/swarm-six-call-d1-ddl-integrity-offline.yml'
permissions:
  contents: read
jobs:
  sqlite-ddl-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact review changes
        run: node swarm/verify-isolation.mjs
      - name: Validate static SQL attestation modules
        run: |
          node --check swarm/smoke-six-call-d1-ddl-digest.mjs
          node --check swarm/smoke-six-call-d1-ddl-digest.test.mjs
          node --check swarm/smoke-six-call-d1-readonly-audit.mjs
      - name: Local SQLite SHA-256 fingerprint integrity / tamper / previous regressions
        run: |
          node --test swarm/smoke-six-call-d1-ddl-digest.test.mjs \
            swarm/smoke-six-call-d1-readonly-audit.test.mjs \
            swarm/smoke-six-call-cross-evidence.test.mjs
      - name: Never import into production
        run: |
          ! grep -R "smoke-six-call-d1-ddl-digest" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'DDL_SHA256_OFFLINE_SQLITE_ONLY_NEVER_LIVE_AUTHORITY'
