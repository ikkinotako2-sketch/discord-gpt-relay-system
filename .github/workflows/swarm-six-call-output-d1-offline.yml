name: Discord Six-Call Verified D1 Outputs OFFLINE (NO MIGRATION)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-output-artifacts.review.sql'
      - 'swarm/smoke-six-call-output-d1.mjs'
      - 'swarm/smoke-six-call-output-d1.test.mjs'
      - 'swarm/SMOKE_SIX_CALL_OUTPUT_D1_READINESS.md'
      - '.github/workflows/swarm-six-call-output-d1-offline.yml'
      - '.github/workflows/swarm-six-call-provider-boundary-offline.yml'
      - '.github/workflows/swarm-free-only-planning-offline.yml'
      - 'swarm/verify-isolation.mjs'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact reviewed eight/eleven/fourteen-file offline diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/smoke-output-files.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const expected=new Set([
            'swarm/smoke-six-call-output-artifacts.review.sql',
            'swarm/smoke-six-call-output-d1.mjs',
            'swarm/smoke-six-call-output-d1.test.mjs',
            'swarm/SMOKE_SIX_CALL_OUTPUT_D1_READINESS.md',
            '.github/workflows/swarm-six-call-output-d1-offline.yml',
            '.github/workflows/swarm-six-call-provider-boundary-offline.yml',
            '.github/workflows/swarm-free-only-planning-offline.yml',
            'swarm/verify-isolation.mjs'
          ]);
          const ownerTaskReview=new Set([
            'swarm/smoke-six-call-owner-task-source.review.sql',
            'swarm/smoke-six-call-owner-task-source.mjs',
            'swarm/smoke-six-call-owner-task-source.test.mjs',
            'swarm/SMOKE_SIX_CALL_OWNER_TASK_READINESS.md',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-six-call-owner-task-source-offline.yml',
            '.github/workflows/swarm-six-call-output-d1-offline.yml'
          ]);
          const elevenObjectAudit=new Set([
            'swarm/SMOKE_SIX_CALL_D1_DDL_INTEGRITY.md',
            'swarm/smoke-six-call-cross-evidence.mjs',
            'swarm/smoke-six-call-cross-evidence.test.mjs',
            'swarm/smoke-six-call-d1-ddl-digest.mjs',
            'swarm/smoke-six-call-d1-ddl-digest.test.mjs',
            'swarm/smoke-six-call-d1-readonly-audit.mjs',
            'swarm/smoke-six-call-d1-readonly-audit.test.mjs',
            'swarm/smoke-six-call-migration-acceptance.test.mjs',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-six-call-output-d1-offline.yml',
            '.github/workflows/swarm-six-call-owner-task-source-offline.yml'
          ]);
          const combinedUnknownAndElevenD1Review=new Set([
            ".github/workflows/swarm-six-call-output-d1-offline.yml",
            ".github/workflows/swarm-six-call-owner-task-source-offline.yml",
            "swarm/SMOKE_SIX_CALL_D1_DDL_INTEGRITY.md",
            "swarm/smoke-six-call-cross-evidence.mjs",
            "swarm/smoke-six-call-cross-evidence.test.mjs",
            "swarm/smoke-six-call-d1-ddl-digest.mjs",
            "swarm/smoke-six-call-d1-ddl-digest.test.mjs",
            "swarm/smoke-six-call-d1-readonly-audit.mjs",
            "swarm/smoke-six-call-d1-readonly-audit.test.mjs",
            "swarm/smoke-six-call-migration-acceptance.test.mjs",
            "swarm/smoke-six-call-owner-task-source.mjs",
            "swarm/smoke-six-call-owner-task-source.test.mjs",
            "swarm/verify-isolation.mjs",
            "swarm/SMOKE_SIX_CALL_UNKNOWN_D1_COMBINED_REVIEW.md",
          ]);
          const combinedUnknownD1AndProviderClockReview=new Set([
            ".github/workflows/swarm-six-call-output-d1-offline.yml",
            ".github/workflows/swarm-six-call-owner-task-source-offline.yml",
            ".github/workflows/swarm-six-call-provider-boundary-offline.yml",
            "swarm/SMOKE_SIX_CALL_D1_DDL_INTEGRITY.md",
            "swarm/SMOKE_SIX_CALL_UNKNOWN_D1_COMBINED_REVIEW.md",
            "swarm/SMOKE_PROVIDER_BOUNDARY_READINESS.md",
            "swarm/smoke-six-call-cross-evidence.mjs",
            "swarm/smoke-six-call-cross-evidence.test.mjs",
            "swarm/smoke-six-call-d1-ddl-digest.mjs",
            "swarm/smoke-six-call-d1-ddl-digest.test.mjs",
            "swarm/smoke-six-call-d1-readonly-audit.mjs",
            "swarm/smoke-six-call-d1-readonly-audit.test.mjs",
            "swarm/smoke-six-call-migration-acceptance.test.mjs",
            "swarm/smoke-six-call-owner-task-source.mjs",
            "swarm/smoke-six-call-owner-task-source.test.mjs",
            "swarm/smoke-six-call-provider-adapter.mjs",
            "swarm/smoke-six-call-provider-adapter.test.mjs",
            "swarm/verify-isolation.mjs",
          ]);
          const postClaimRowDriftReview=new Set([
            'swarm/SMOKE_SIX_CALL_CONTROLLER_STATUS.md',
            'swarm/smoke-six-call-controller.mjs',
            'swarm/smoke-six-call-controller.test.mjs',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-six-call-owner-task-source-offline.yml',
            '.github/workflows/swarm-six-call-output-d1-offline.yml',
            '.github/workflows/swarm-six-call-provider-boundary-offline.yml',
            '.github/workflows/swarm-owner-task-register-offline.yml',
          ]);
          const postClaimRowDriftBranch=process.env.GITHUB_HEAD_REF==='fix/offline-postclaim-state-drift-20261028';
          const reviewedOwnerTaskBranch=['feature/discord-owner-task-registration-offline-20261028',
            'fix/offline-owner-review-async-timestamp-20261028','fix/offline-owner-task-pending-window-cas-20261028'].includes(process.env.GITHUB_HEAD_REF);
          const reviewedOwnerTaskRegistration=new Set([
            'swarm/smoke-six-call-owner-task-register.mjs',
            'swarm/smoke-six-call-owner-task-register.test.mjs',
            'swarm/SMOKE_OWNER_TASK_REGISTER_REVIEW.md',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-owner-task-register-offline.yml',
            '.github/workflows/swarm-six-call-provider-boundary-offline.yml',
            '.github/workflows/swarm-six-call-output-d1-offline.yml',
            '.github/workflows/swarm-six-call-owner-task-source-offline.yml'
          ]);
          const actual=readFileSync('/tmp/smoke-output-files.txt','utf8').trim().split('\n');
          if(![expected,ownerTaskReview,elevenObjectAudit,combinedUnknownAndElevenD1Review,combinedUnknownD1AndProviderClockReview,...(reviewedOwnerTaskBranch?[reviewedOwnerTaskRegistration]:[]),...(postClaimRowDriftBranch?[postClaimRowDriftReview]:[])].some(s=>actual.length===s.size&&
             new Set(actual).size===s.size&&actual.every(x=>s.has(x))))throw Error('UNREVIEWED_SQL_OR_CODE_PATH');
          console.log('OUTPUT_D1_EXACT_REVIEWED_SCOPE_PASS');
          NODE
      - name: Offline local SQLite verified output tests and six-call regressions
        run: |
          node --check swarm/smoke-six-call-output-d1.mjs
          node --check swarm/smoke-six-call-output-d1.test.mjs
          node --test swarm/smoke-six-call-output-d1.test.mjs \
            swarm/smoke-six-call-provider-adapter.test.mjs \
            swarm/smoke-six-call-postclaim-stop.test.mjs \
            swarm/smoke-six-call-d1-store.test.mjs \
            swarm/smoke-six-call-d1-ddl-digest.test.mjs
      - name: Strictly no production wiring or migrations
        run: |
          ! grep -R 'smoke-six-call-output-d1' worker-relay.mjs worker-loop.mjs swarm/cron.mjs swarm/runner.mjs
          echo 'SIX_CALL_OUTPUT_D1_OFFLINE_ONLY_NO_LIVE_WRITES'
