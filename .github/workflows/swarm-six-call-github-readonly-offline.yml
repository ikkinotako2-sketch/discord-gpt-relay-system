name: Discord Six-Call GitHub Read-Only Evidence OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-github-readonly.mjs'
      - 'swarm/smoke-six-call-github-readonly.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_GITHUB_READONLY_STATUS.md'
      - '.github/workflows/swarm-six-call-github-readonly-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce five-file isolation
        run: node swarm/verify-isolation.mjs
      - name: Offline source and tests syntax validation
        run: |
          node --check swarm/smoke-six-call-github-readonly.mjs
          node --check swarm/smoke-six-call-github-readonly.test.mjs
      - name: GitHub GET-only simulations and previous quota evidence
        run: |
          node --test swarm/smoke-six-call-github-readonly.test.mjs \
            swarm/smoke-six-call-free-neuron-review.test.mjs \
            swarm/smoke-six-call-readiness-report.test.mjs
      - name: Verify no production integration or external GitHub mutation
        run: |
          ! grep -R "smoke-six-call-github-readonly" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'GITHUB_GET_ONLY_HEAD_AND_ACTIONS_AUDIT_OFFLINE'
