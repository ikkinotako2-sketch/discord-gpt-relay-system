name: Discord Workers AI Model Catalog GET Only 20261027
on:
  push:
    branches: [audit/discord-d1-watchdog-readonly-20261027-once]
    paths:
      - '.github/workflows/discord-model-catalog-readonly-20261027.yml'
permissions:
  contents: read
concurrency:
  group: discord-model-catalog-get-20261027
  cancel-in-progress: false
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9f2971c704cb792c36cea8854eb0c83dc21b1e15
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact account Workers AI model catalog GET without inference
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const requested='@cf/openai/gpt-oss-20b';
          if(!token){console.log('CATALOG_AUTH=MISSING');process.exit(0);}
          if(new Date().toISOString().slice(0,10)!=='2026-10-27')
            throw Error('AUDIT_WINDOW_CLOSED');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+
            '/ai/models/search?search=gpt-oss-20b&per_page=20';
          let res,data;
          try{
            res=await fetch(url,{method:'GET',headers:{
              Authorization:'Bearer '+token,Accept:'application/json'
            },signal:AbortSignal.timeout(12000)});
            console.log('CATALOG_HTTP_STATUS='+res.status);
            if(res.status!==200)throw Error('CATALOG_NOT_READABLE');
            data=await res.json();
          }catch{
            console.log('CATALOG_MODEL_LISTING=UNVERIFIED');
            console.log('MODEL_ENTITLEMENT=UNVERIFIED');
            console.log('PRODUCTION_INFERENCE_AUTHORIZED=false');
            process.exit(0);
          }
          if(data?.success!==true||!Array.isArray(data.result)){
            console.log('CATALOG_RESULT_SHAPE=UNVERIFIED');
            console.log('MODEL_ENTITLEMENT=UNVERIFIED');
            console.log('PRODUCTION_INFERENCE_AUTHORIZED=false');
            process.exit(0);
          }
          const names=data.result.map(item=>[
            item?.id,item?.name,item?.model,item?.model_id
          ]).flat().filter(x=>typeof x==='string');
          const exact=names.includes(requested);
          console.log('CATALOG_RESULT_COUNT='+data.result.length);
          console.log('CATALOG_EXACT_MODEL_ID_MATCH='+exact);
          console.log('MODEL_ENTITLEMENT=UNVERIFIED');
          console.log('ACCOUNT_WIDE_FREE_NEURONS=UNVERIFIED');
          console.log('AI_RUN_REQUESTS=0');
          console.log('PRODUCTION_INFERENCE_AUTHORIZED=false');
          NODE
