name: Discord Watchdog Credential Readiness (READ ONLY)
on:
  push:
    branches: [deploy/discord-watchdog-parked-20261015]
    paths: ['.github/workflows/discord-watchdog-credential-readiness-once.yml']
permissions:
  contents: read
jobs:
  inspect-only:
    if: ${{ github.event.head_commit.message == 'Inspect isolated watchdog restore credential readiness once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_RESTORE_TOKEN: ${{ secrets.WATCHDOG_RESTORE_TOKEN }}
      WATCHDOG_D1_READ_TOKEN: ${{ secrets.WATCHDOG_D1_READ_TOKEN }}
      DISCORD_D1_READ_TOKEN: ${{ secrets.DISCORD_D1_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only presence and isolated Worker metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const hasKey=x=>typeof x==='string'&&x.length>=8;
          console.log('DEDICATED_RESTORE_REPO_SECRET='+ (hasKey(process.env.WATCHDOG_RESTORE_TOKEN)?'PRESENT_SCOPE_UNVERIFIED':'MISSING'));
          console.log('DEDICATED_D1_REPO_SECRET='+ (hasKey(process.env.WATCHDOG_D1_READ_TOKEN)?'PRESENT_SCOPE_UNVERIFIED':'MISSING'));
          console.log('EXISTING_DISCORD_D1_READ_REPO_SECRET='+ (hasKey(process.env.DISCORD_D1_READ_TOKEN)?'PRESENT':'MISSING'));
          if(!hasKey(token))throw Error('PRIMARY_CLOUDFLARE_READ_TOKEN_MISSING');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/discord-smoke-independent-watchdog-staged';
          async function metadata(path){
            const response=await fetch(url+path,{
              method:'GET',
              headers:{Authorization:'Bearer '+token},
              signal:AbortSignal.timeout(12000)
            });
            if(response.status!==200)return {status:response.status,success:false};
            const obj=await response.json();
            if(obj.success!==true)return {status:200,success:false};
            return {status:200,success:true,result:obj.result};
          }
          const [settings,secrets]=await Promise.all([metadata('/settings'),metadata('/secrets')]);
          if(!settings.success||!Array.isArray(settings.result.bindings))
            throw Error('PARKED_REMOTE_SETTINGS_NOT_VERIFIED');
          for(const [k,value] of [['WATCHDOG_ARMED','false'],['WATCHDOG_APPROVAL','NOT_APPROVED']]){
            const matching=settings.result.bindings.filter(b=>b?.name===k);
            if(matching.length!==1||matching[0].type!=='plain_text'||matching[0].text!==value)
              throw Error('PARKED_ACTIVATION_UNEXPECTED_'+k);
          }
          const deployedNames=secrets.success&&Array.isArray(secrets.result)
            ?secrets.result.map(x=>x.name):null;
          if(deployedNames===null)console.log('PARKED_REMOTE_SECRET_NAMES=UNVERIFIED_HTTP_'+secrets.status);
          else{
            const needed=['WATCHDOG_RESTORE_TOKEN','WATCHDOG_D1_READ_TOKEN'];
            console.log('PARKED_REMOTE_RESTORE_SECRET='+(deployedNames.includes(needed[0])?'PRESENT_SCOPE_UNVERIFIED':'ABSENT'));
            console.log('PARKED_REMOTE_D1_READ_SECRET='+(deployedNames.includes(needed[1])?'PRESENT_SCOPE_UNVERIFIED':'ABSENT'));
          }
          // Inspect authorization capabilities only; never create or list tokens.
          const groupURL='https://api.cloudflare.com/client/v4/accounts/'+account+'/tokens/permission_groups';
          try{
            const response=await fetch(groupURL,{method:'GET',
              headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
            if(response.status!==200)console.log('ACCOUNT_TOKEN_PERMISSION_GROUPS_READ=DENIED_OR_UNAVAILABLE_'+response.status);
            else{
              const data=await response.json();
              console.log('ACCOUNT_TOKEN_PERMISSION_GROUPS_READ='+(data?.success===true?'AVAILABLE_NO_WRITE_PROOF':'INVALID_RESPONSE'));
              const groups=Array.isArray(data?.result)?data.result:[];
              console.log('SELECTABLE_NARROW_WORKER_EDITOR_GROUP='+(groups.some(g=>g?.is_selectable===true&&/Individual Workers Editor/i.test(g?.name||''))?'YES':'NOT_VERIFIED'));
            }
          }catch{console.log('ACCOUNT_TOKEN_PERMISSION_GROUPS_READ=UNVERIFIED');}
          // Scope probe is GET-only and touches only the primary Discord Worker
          // and this project's own independent watchdog (no other projects).
          if(hasKey(process.env.WATCHDOG_RESTORE_TOKEN)){
            const narrow=process.env.WATCHDOG_RESTORE_TOKEN;
            async function scopedRead(worker){
              try{
                const u='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker+'/deployments';
                const r=await fetch(u,{method:'GET',headers:{Authorization:'Bearer '+narrow},signal:AbortSignal.timeout(12000)});
                if(r.status!==200)return 'HTTP_'+r.status;
                const j=await r.json();
                return j.success===true&&Array.isArray(j.result?.deployments)?'PASS':'UNVERIFIED';
              }catch{return 'ERROR';}
            }
            // Cloudflare token verification is GET-only and reports only validity.
            try{
              const verify=await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify',{
                method:'GET',headers:{Authorization:'Bearer '+narrow},signal:AbortSignal.timeout(12000)
              });
              if(verify.status!==200)console.log('RESTORE_TOKEN_VERIFY_HTTP='+verify.status);
              else{
                const result=await verify.json();
                const status=result?.success===true?result?.result?.status:null;
                console.log('RESTORE_TOKEN_VERIFY_STATUS='+(['active','disabled','expired'].includes(status)?status:'UNVERIFIED'));
              }
            }catch{console.log('RESTORE_TOKEN_VERIFY_STATUS=NETWORK_UNVERIFIED');}
            // Token owner / account binding diagnostic: GET only, report status, no IDs or values.
            try {
              const verifyUrl='https://api.cloudflare.com/client/v4/accounts/'+account+'/tokens/verify';
              const response=await fetch(verifyUrl,{method:'GET',headers:{Authorization:'Bearer '+narrow},signal:AbortSignal.timeout(12000)});
              let outcome='HTTP_'+response.status;
              if(response.status===200){
                const data=await response.json();
                outcome=data?.success===true&&data?.result?.status==='active'?'ACCOUNT_OWNED_ACTIVE':'NOT_VERIFIED';
              }
              console.log('RESTORE_ACCOUNT_TOKEN_VERIFY='+outcome);
            }catch{console.log('RESTORE_ACCOUNT_TOKEN_VERIFY=NETWORK_UNVERIFIED');}
            const primary=await scopedRead('steep-glitter-b5cddiscord-ai-relay-lab');
            const other=await scopedRead('discord-smoke-independent-watchdog-staged');
            console.log('SCOPED_RESTORE_PRIMARY_DISCORD_GET='+primary);
            console.log('SCOPED_RESTORE_WATCHDOG_NEGATIVE_CONTROL_GET='+other);
            // Target-only HTTP GET matrix to distinguish an endpoint-specific
            // rejection from missing Worker resource permissions.
            const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/steep-glitter-b5cddiscord-ai-relay-lab';
            for(const [label,suffix] of [
              ['SETTINGS','/settings'],
              ['VERSIONS','/versions'],
              ['DEPLOYMENTS','/deployments']
            ]){
              try{
                const r=await fetch(root+suffix,{method:'GET',headers:{Authorization:'Bearer '+narrow},signal:AbortSignal.timeout(12000)});
                console.log('SCOPED_RESTORE_'+label+'_HTTP='+r.status);
              }catch{console.log('SCOPED_RESTORE_'+label+'_HTTP=NETWORK_ERROR');}
            }
            console.log('SCOPED_RESTORE_PROBE=GET_ONLY_NOT_PERMISSION_CERTIFICATION');
          }
          console.log('NO_CLOUDFLARE_WRITES_NO_MODEL_NO_SECRETS_EXPOSED');
          NODE
# 2026-10-16 check owner-created scoped restore token presence and read-only Worker scope; never print tokens.
# 2026-10-16 verify narrow token status with GET-only user token endpoint, output status only.

# 2026-10-20 owner requested all-in-one re-evaluation: GET-only scope check; no live changes.
# 2026-10-20 distinct endpoint read-only scope probe, no writes or secret output.

# 2026-10-22 owner updated scoped restore token; recheck read permissions only.
# 2026-10-22 distinguish account-owned token verification from user-token endpoint, GET only.

# 2026-10-22 owner confirmed GitHub scoped restore token update; GET-only isolated retest.
