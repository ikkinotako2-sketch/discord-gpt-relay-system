name: Discord Watchdog Credential Readiness (READ ONLY)
on:
  push:
    branches: [deploy/discord-watchdog-parked-20261015]
    paths: ['.github/workflows/discord-watchdog-credential-readiness-once.yml']
permissions:
  contents: read
jobs:
  inspect-only:
    if: ${{ github.event.head_commit.message == 'Inspect isolated watchdog restore credential readiness once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_RESTORE_TOKEN: ${{ secrets.WATCHDOG_RESTORE_TOKEN }}
      WATCHDOG_D1_READ_TOKEN: ${{ secrets.WATCHDOG_D1_READ_TOKEN }}
      DISCORD_D1_READ_TOKEN: ${{ secrets.DISCORD_D1_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only presence and isolated Worker metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const hasKey=x=>typeof x==='string'&&x.length>=8;
          console.log('DEDICATED_RESTORE_REPO_SECRET='+ (hasKey(process.env.WATCHDOG_RESTORE_TOKEN)?'PRESENT_SCOPE_UNVERIFIED':'MISSING'));
          console.log('DEDICATED_D1_REPO_SECRET='+ (hasKey(process.env.WATCHDOG_D1_READ_TOKEN)?'PRESENT_SCOPE_UNVERIFIED':'MISSING'));
          console.log('EXISTING_DISCORD_D1_READ_REPO_SECRET='+ (hasKey(process.env.DISCORD_D1_READ_TOKEN)?'PRESENT':'MISSING'));
          if(!hasKey(token))throw Error('PRIMARY_CLOUDFLARE_READ_TOKEN_MISSING');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/discord-smoke-independent-watchdog-staged';
          async function metadata(path){
            const response=await fetch(url+path,{
              method:'GET',
              headers:{Authorization:'Bearer '+token},
              signal:AbortSignal.timeout(12000)
            });
            if(response.status!==200)return {status:response.status,success:false};
            const obj=await response.json();
            if(obj.success!==true)return {status:200,success:false};
            return {status:200,success:true,result:obj.result};
          }
          const [settings,secrets]=await Promise.all([metadata('/settings'),metadata('/secrets')]);
          if(!settings.success||!Array.isArray(settings.result.bindings))
            throw Error('PARKED_REMOTE_SETTINGS_NOT_VERIFIED');
          for(const [k,value] of [['WATCHDOG_ARMED','false'],['WATCHDOG_APPROVAL','NOT_APPROVED']]){
            const matching=settings.result.bindings.filter(b=>b?.name===k);
            if(matching.length!==1||matching[0].type!=='plain_text'||matching[0].text!==value)
              throw Error('PARKED_ACTIVATION_UNEXPECTED_'+k);
          }
          const deployedNames=secrets.success&&Array.isArray(secrets.result)
            ?secrets.result.map(x=>x.name):null;
          if(deployedNames===null)console.log('PARKED_REMOTE_SECRET_NAMES=UNVERIFIED_HTTP_'+secrets.status);
          else{
            const needed=['WATCHDOG_RESTORE_TOKEN','WATCHDOG_D1_READ_TOKEN'];
            console.log('PARKED_REMOTE_RESTORE_SECRET='+(deployedNames.includes(needed[0])?'PRESENT_SCOPE_UNVERIFIED':'ABSENT'));
            console.log('PARKED_REMOTE_D1_READ_SECRET='+(deployedNames.includes(needed[1])?'PRESENT_SCOPE_UNVERIFIED':'ABSENT'));
          }
          console.log('NO_CLOUDFLARE_WRITES_NO_MODEL_NO_SECRETS_EXPOSED');
          NODE
