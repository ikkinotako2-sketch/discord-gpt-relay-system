name: Discord Six-Call D1 Store OFFLINE (NO MIGRATION)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-d1-schema.review.sql'
      - 'swarm/smoke-six-call-d1-store.mjs'
      - 'swarm/smoke-six-call-d1-store.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_D1_STATUS.md'
      - '.github/workflows/swarm-six-call-d1-store-offline.yml'
permissions:
  contents: read
jobs:
  sqlite-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce strict six-file isolation
        run: node swarm/verify-isolation.mjs
      - name: Static syntax checks
        run: |
          node --check swarm/smoke-six-call-d1-store.mjs
          node --check swarm/smoke-six-call-d1-store.test.mjs
          node --check swarm/smoke-six-call-controller.mjs
      - name: Real local SQLite transaction and restart tests (NO D1 API)
        run: node --test swarm/smoke-six-call-d1-store.test.mjs swarm/smoke-six-call-controller.test.mjs
      - name: No production imports, Cloudflare clients or secrets
        run: |
          ! grep -R -E "smoke-six-call-d1-store|smoke-six-call-d1-schema" worker-loop.mjs command-center/server.mjs swarm/cron.mjs swarm/runner.mjs
          echo 'OFFLINE_SQLITE_ONLY_NO_D1_MIGRATION_NO_CLOUDFLARE_NO_AI'
