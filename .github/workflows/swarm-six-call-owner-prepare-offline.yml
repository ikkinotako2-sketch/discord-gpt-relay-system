name: Discord Six-Call OAuth Owner Prepare Offline (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-owner-prepare.mjs'
      - 'swarm/smoke-six-call-owner-prepare.test.mjs'
      - 'swarm/smoke-six-call-owner-prepare-index.review.sql'
      - 'swarm/SMOKE_SIX_CALL_OWNER_PREPARE_STATUS.md'
      - 'swarm/verify-isolation.mjs'
      - '.github/workflows/swarm-six-call-owner-prepare-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block unauthorized production, other app, and workflow modifications
        run: node swarm/verify-isolation.mjs
      - name: Syntax check offline modules
        run: |
          node --check swarm/smoke-six-call-owner-prepare.mjs
          node --check swarm/smoke-six-call-owner-prepare.test.mjs
      - name: Real local SQLite and cryptographic OAuth-session tests
        run: node --test swarm/smoke-six-call-owner-prepare.test.mjs swarm/smoke-six-call-controller.test.mjs swarm/smoke-six-call-d1-store.test.mjs
      - name: Assert still disconnected from production entry points
        run: |
          ! grep -R -E "smoke-six-call-owner-prepare|SMOKE_OWNER_PREPARE_ENABLED" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/cron.mjs swarm/runner.mjs
          echo 'OWNER_REVIEW_PREPARE_STAGED_NO_LIVE_ROUTES_NO_CLOUDFLARE_NO_INFERENCE'
