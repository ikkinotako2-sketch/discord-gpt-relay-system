name: Enable Approved Discord Loop Cron Once
on:
  push:
    branches: [main]
    paths:
      - 'preflight/loop-cron-approved.once'
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  enable:
    if: ${{ github.event.head_commit.message == 'Enable approved Discord loop cron once' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM: ENABLE-ONE-MINUTE-CRON
    steps:
      - uses: actions/checkout@v4
      - name: Verify identity and explicit operator authorization
        run: |
          test "$CONFIRM" = 'ENABLE-ONE-MINUTE-CRON' || exit 1
          test "$(cat preflight/loop-cron-approved.once)" = 'APPROVED_ONCE:CRON:aecc9c29-dbef-4abb-8036-3fd3bfbacc23' || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || exit 1
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.loop.toml || exit 1
          grep -Fxq 'crons = ["*/1 * * * *"]' wrangler.loop.toml || exit 1
          grep -Fxq 'database_name = "discord-relay-loop-state"' wrangler.loop.toml || exit 1
          if grep -Fq 'REPLACE_WITH_' wrangler.loop.toml; then exit 1; fi
      - name: Require verified D1-backed production Worker
        run: |
          node --input-type=module <<'NODE'
          const url='https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          const a=await fetch(url,{signal:AbortSignal.timeout(12000)});
          const t=await a.text();
          const b=await fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(12000)});
          if(a.status!==200 || t.trim()!=='Discord GPT Relay loop-v1 ready.' || b.status!==401)
            throw Error('Loop Worker and signed interaction handler not ready. Cron remains disabled.');
          NODE
      - name: Confirm exact live loop version before enabling Cron
        run: |
          npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab > /tmp/discord-loop-live-cron.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/discord-loop-live-cron.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const found=[...raw.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(m=>m[1]);
          if(found.at(-1)!=='aecc9c29-dbef-4abb-8036-3fd3bfbacc23')throw Error('Unknown live Worker; do not enable cron');
          console.log('Exact approved loop Worker is live');
          NODE
      - name: Activate one-minute Cloudflare Cron trigger only after verification
        run: npx --yes wrangler@4 triggers deploy --config wrangler.loop.toml
      - name: Reminder
        run: echo 'Cron enabled. No AI work will occur until the authorized owner explicitly issues /loop. One active job, max 4 claimed model calls.'
