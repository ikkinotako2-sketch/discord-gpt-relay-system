name: Discord Six-Call Durable Release Fence OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-release-fence.mjs'
      - 'swarm/smoke-six-call-release-fence.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_RELEASE_FENCE_STATUS.md'
      - '.github/workflows/swarm-six-call-release-fence-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce isolated safety scope
        run: node swarm/verify-isolation.mjs
      - name: Syntax-check release fence and tests
        run: |
          node --check swarm/smoke-six-call-release-fence.mjs
          node --check swarm/smoke-six-call-release-fence.test.mjs
      - name: Offline persistent one-shot release contention simulations
        run: node --test swarm/smoke-six-call-release-fence.test.mjs swarm/smoke-six-call-stop-reconcile.test.mjs
      - name: Ensure source is not wired into any production API
        run: |
          ! grep -R "smoke-six-call-release-fence" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'ONE_SHOT_RELEASE_FENCE_OFFLINE_LOCAL_ONLY'
