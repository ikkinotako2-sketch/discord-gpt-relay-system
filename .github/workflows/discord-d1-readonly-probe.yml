name: Discord-only D1 Read-Only Diagnostic (NO DEPLOY)
on:
  push:
    branches:
      - diagnostics/discord-d1-readonly-20261012
    paths:
      - '.github/workflows/discord-d1-readonly-probe.yml'
permissions:
  contents: read
jobs:
  d1-probe:
    if: ${{ github.event.head_commit.message == 'Run isolated Discord-only D1 diagnostic once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Strictly scoped secret-safe read-only diagnostic
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expectedRepo='ikkinotako2-sketch/discord-gpt-relay-system';
          const expectedRef='refs/heads/diagnostics/discord-d1-readonly-20261012';
          if(process.env.GITHUB_REPOSITORY!==expectedRepo||process.env.GITHUB_REF!==expectedRef)
            throw Error('D1_DIAG_ISOLATION_FAILED');
          const id='d80b08a4-0ff7-4320-9575-0d3c55cf7aba';
          const account='6c8ccd6aface937ab5dabef61cb64534';
          if(process.env.CLOUDFLARE_ACCOUNT_ID!==account||!process.env.CLOUDFLARE_API_TOKEN)
            throw Error('D1_DIAG_MISSING_ACCOUNT_OR_TOKEN');
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+id;
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function request(label,method,body){
            const config={method,headers:{...headers,...(body?{'Content-Type':'application/json'}:{})},signal:AbortSignal.timeout(15000)};
            if(body)config.body=JSON.stringify(body);
            try{
              const response=await fetch(endpoint+(method==='POST'?'/query':''),config);
              const data=await response.json().catch(()=>null);
              const codes=Array.isArray(data?.errors)?data.errors.map(x=>x.code).filter(x=>Number.isInteger(x)).slice(0,3):[];
              const status=response.status;
              const category=status===401||status===403||codes.includes(10000)?'AUTHORIZATION_OR_SCOPE'
                :status===404?'DATABASE_NOT_FOUND_OR_INACCESSIBLE'
                :status===429?'RATE_LIMIT'
                :response.ok&&data?.success===true?'SUCCESS'
                :'OTHER_CLOUDFLARE_FAILURE';
              let activeJobs;
              if(label==='D1_SELECT'&&category==='SUCCESS'){
                const result=data?.result;
                const first=Array.isArray(result)?result[0]:null;
                const row=first?.results?.[0];
                if(first?.success===true&&Number.isSafeInteger(row?.active_jobs)&&row.active_jobs>=0)
                  activeJobs=row.active_jobs;
              }
              console.log('D1_PROBE_'+label+' '+JSON.stringify({status,category,codes, ...(activeJobs===undefined?{}:{active_jobs:activeJobs})}));
              return {category,activeJobs};
            }catch(e){
              const kind=e?.name==='TimeoutError'?'TIMEOUT':'NETWORK_OR_JSON_ERROR';
              console.log('D1_PROBE_'+label+' '+JSON.stringify({category:kind}));
              return {category:kind};
            }
          }
          const get=await request('METADATA','GET');
          if(get.category!=='SUCCESS')process.exitCode=1;
          else{
            const query=await request('D1_SELECT','POST',{sql:"SELECT COUNT(*) AS active_jobs FROM relay_loop_jobs WHERE status IN ('queued','claimed') OR active_slot = 1;"});
            if(query.category!=='SUCCESS'||query.activeJobs===undefined)process.exitCode=1;
            else console.log('D1_READONLY_COUNT_RECORDED; no D1 write or Worker deploy performed');
          }
          NODE
