name: Approved GPT OSS Free Pilot Release Once
on:
  push:
    branches: [main]
    paths:
      - 'preflight/gpt-oss-pilot-live-approved.once'
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event.head_commit.message == 'Launch approved one-time GPT OSS Free pilot rollout' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: steep-glitter-b5cddiscord-ai-relay-lab
      BEFORE_VERSION: 91dd0014-179c-44b8-88ac-7084776f5e7b
      CANDIDATE_VERSION: 64b48d3f-a427-4229-af27-c8c3710fa309
      LIVE_URL: https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/
      PREVIEW_URL: https://64b48d3f-steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Cloudflare project and GPT-OSS opt-in
        run: |
          set -euo pipefail
          test "$(cat preflight/gpt-oss-pilot-live-approved.once)" = 'APPROVED_FREE_ONLY:GPT_OSS_20B:64b48d3f-a427-4229-af27-c8c3710fa309'
          test "$BEFORE_VERSION" = '91dd0014-179c-44b8-88ac-7084776f5e7b'
          test "$CANDIDATE_VERSION" = '64b48d3f-a427-4229-af27-c8c3710fa309'
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534'
          test -n "$CLOUDFLARE_API_TOKEN"
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.gpt-oss.toml
          grep -Fxq 'main = "worker-loop.mjs"' wrangler.gpt-oss.toml
          grep -Fxq 'database_name = "discord-relay-loop-state"' wrangler.gpt-oss.toml
          grep -Fxq 'database_id = "d80b08a4-0ff7-4320-9575-0d3c55cf7aba"' wrangler.gpt-oss.toml
          grep -Fxq 'keep_vars = true' wrangler.gpt-oss.toml
          grep -Fxq 'binding = "AI"' wrangler.gpt-oss.toml
          grep -Fxq 'crons = ["*/1 * * * *"]' wrangler.gpt-oss.toml
          grep -Fxq 'LOOP_AI_MODEL = "@cf/openai/gpt-oss-20b"' wrangler.gpt-oss.toml
          grep -Fq 'resolveLoopModel(env)' worker-loop.mjs
      - name: Run regression tests without any model inference
        run: |
          node --test relay.test.mjs worker-relay.test.mjs loop-core.test.mjs loop-worker.test.mjs loop-state.test.mjs loop-d1.test.mjs worker-loop.test.mjs loop-quality.test.mjs
      - name: Verify baseline and candidate identities, no production modifications
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --name "$WORKER_NAME" > /tmp/gptoss-before.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('/tmp/gptoss-before.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const vs=[...s.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          if(vs.at(-1)!==process.env.BEFORE_VERSION)throw Error('Baseline changed, no rollout permitted.');
          console.log('Existing user-tested Llama v2 still at 100%.');
          NODE
          node --input-type=module <<'NODE'
          async function check(url){
            const g=await fetch(url,{signal:AbortSignal.timeout(12000)});
            const body=await g.text();
            const p=await fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(12000)});
            return {status:g.status,body:body.trim(),unsigned:p.status};
          }
          const [live,preview]=await Promise.all([check(process.env.LIVE_URL),check(process.env.PREVIEW_URL)]);
          if(live.status!==200||live.body!=='Discord GPT Relay loop-v2 task-focus ready.'||live.unsigned!==401)
            throw Error('Original production failed readiness check.');
          if(preview.status!==200||preview.body!=='Discord GPT Relay gpt-oss pilot ready.'||preview.unsigned!==401)
            throw Error('GPT-OSS preview failed readiness check.');
          console.log('Both versions healthy; Discord signature gates in effect.');
          NODE
          npx --yes wrangler@4 versions list --name "$WORKER_NAME" > /tmp/gptoss-versions.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('/tmp/gptoss-versions.txt','utf8');
          if(!s.includes(process.env.CANDIDATE_VERSION))throw Error('Pinned GPT-OSS version missing. Stop.');
          NODE
      - name: Promote only approved GPT-OSS candidate
        id: promote
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "$CANDIDATE_VERSION@100%" --name "$WORKER_NAME" --message "Approved limited GPT-OSS pilot; existing Discord bindings preserved" --yes
      - name: Verify propagated GPT-OSS identity and reject invalid Discord requests
        id: verify
        run: |
          node --input-type=module <<'NODE'
          for(let n=1;n<=12;n++){
            try {
              const g=await fetch(process.env.LIVE_URL,{signal:AbortSignal.timeout(10000)});
              const t=await g.text();
              const p=await fetch(process.env.LIVE_URL,{method:'POST',body:'{}',signal:AbortSignal.timeout(10000)});
              const correct=g.status===200&&t.trim()==='Discord GPT Relay gpt-oss pilot ready.'&&p.status===401;
              console.log(JSON.stringify({attempt:n,getStatus:g.status,gptossIdentity:t.trim()==='Discord GPT Relay gpt-oss pilot ready.',unsignedPostStatus:p.status}));
              if(correct)process.exit(0);
            }catch{console.log('A readiness attempt was inconclusive');}
            if(n<12)await new Promise(r=>setTimeout(r,5000));
          }
          throw Error('GPT-OSS pilot failed readiness after promotion. Rollback required.');
          NODE
          npx --yes wrangler@4 deployments list --name "$WORKER_NAME" > /tmp/gptoss-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('/tmp/gptoss-after.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const ids=[...s.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          if(ids.at(-1)!==process.env.CANDIDATE_VERSION)throw Error('GPT-OSS pilot is not current 100% version.');
          console.log('Exact GPT-OSS pilot is 100% of Worker traffic.');
          NODE
      - name: Restore user-tested Llama v2 if promotion failed or its outcome is uncertain
        if: ${{ failure() && steps.promote.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --name "$WORKER_NAME" > /tmp/gptoss-failed-current.txt
          CURRENT="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('/tmp/gptoss-failed-current.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const ids=[...s.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          console.log(ids.at(-1)??'UNKNOWN');
          NODE
          )"
          if [ "$CURRENT" = "$BEFORE_VERSION" ]; then echo 'Original Llama v2 remains live'; exit 0; fi
          if [ "$CURRENT" != "$CANDIDATE_VERSION" ]; then
            echo 'Unknown concurrent deployment; no blind rollback'
            exit 1
          fi
          npx --yes wrangler@4 versions deploy "$BEFORE_VERSION@100%" --name "$WORKER_NAME" --message "Restore proven Llama v2 after GPT-OSS pilot error" --yes
          node --input-type=module <<'NODE'
          for(let n=1;n<=10;n++){
            try {
              const g=await fetch(process.env.LIVE_URL,{signal:AbortSignal.timeout(12000)});
              const t=await g.text();
              if(g.status===200 && t.trim()==='Discord GPT Relay loop-v2 task-focus ready.')process.exit(0);
            }catch{}
            if(n<10)await new Promise(r=>setTimeout(r,5000));
          }
          throw Error('Attempted rollback but could not verify Llama v2 readiness.');
          NODE
      - name: Remind operator to do a single budget-limited real inference test
        if: ${{ success() }}
        run: |
          echo 'GPT-OSS pilot is live. This confirms routing, D1 and signature verification only.'
          echo 'No actual GPT-OSS inference has been tested. On a confirmed Free plan, run one short /loop job and monitor /loop-status.'
          echo 'A model error or quota failure must not trigger blind reruns.'
