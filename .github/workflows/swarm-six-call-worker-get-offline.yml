name: Discord Six-Call Worker and Watchdog GET Audit OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-worker-get-audit.mjs'
      - 'swarm/smoke-six-call-worker-get-audit.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_WORKER_GET_STATUS.md'
      - '.github/workflows/swarm-six-call-worker-get-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify limited five-file changes
        run: node swarm/verify-isolation.mjs
      - name: Syntax of safe-only Worker GET observer
        run: |
          node --check swarm/smoke-six-call-worker-get-audit.mjs
          node --check swarm/smoke-six-call-worker-get-audit.test.mjs
      - name: Worker and independent watchdog simulated GET fault injection
        run: |
          node --test swarm/smoke-six-call-worker-get-audit.test.mjs \
            swarm/smoke-six-call-d1-readonly-audit.test.mjs \
            swarm/smoke-six-call-github-readonly.test.mjs
      - name: Assert Worker GET observer not imported by production
        run: |
          ! grep -R "smoke-six-call-worker-get-audit" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'WORKER_WATCHDOG_GET_ONLY_OFFLINE_NO_REMOTE_WRITES'
