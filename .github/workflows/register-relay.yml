name: Verify Live Worker and Register Relay (No Deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discord-relay-registration
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Worker with eventual-consistency retries
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const get = await fetch(url, { signal: AbortSignal.timeout(10000) });
              const body = await get.text();
              const post = await fetch(url, {
                method: 'POST',
                body: '{}',
                signal: AbortSignal.timeout(10000)
              });
              console.log(JSON.stringify({
                attempt,
                getStatus: get.status,
                responsePrefix: body.slice(0, 160),
                missingSignatureStatus: post.status
              }));
              if (get.status === 200 &&
                  body.includes('Discord GPT Relay candidate') &&
                  post.status === 401) {
                console.log('Live candidate and Discord signature gate both verified');
                process.exit(0);
              }
            } catch (error) {
              console.log(JSON.stringify({attempt, error: String(error)}));
            }
            if (attempt < 10) await sleep(5000);
          }
          throw Error('Live Worker did not pass checks; DO NOT register /relay or rerun deployment. Use logs to assess whether rollback is needed.');
          NODE
      - name: Validate token and register only /relay (preserves /ask)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.DISCORD_BOT_TOKEN;
          if (!token) throw Error('Missing DISCORD_BOT_TOKEN GitHub Secret');
          const app = '1558705011339427840';
          const me = await fetch('https://discord.com/api/v10/users/@me', {
            headers: { Authorization: 'Bot ' + token },
          });
          if (!me.ok) throw Error('Discord Bot Token validation failed: HTTP ' + me.status);
          const bot = await me.json();
          if (!bot.bot || bot.id !== app) throw Error('Wrong Discord Bot Token; no command registered');
          const command = JSON.parse(fs.readFileSync('discord/relay-command.json', 'utf8'));
          if (command.name !== 'relay' || command.type !== 1) throw Error('Unexpected command name or type');
          const response = await fetch(`https://discord.com/api/v10/applications/${app}/commands`, {
            method: 'POST',
            headers: { 'Authorization': 'Bot ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(command),
          });
          if (!response.ok) {
            console.error('Discord registration HTTP status:', response.status);
            throw Error('Command registration failed');
          }
          console.log('Discord /relay registered successfully. Status:', response.status);
          NODE
