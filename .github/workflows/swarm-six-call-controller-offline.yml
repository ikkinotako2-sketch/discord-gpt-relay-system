name: Discord Six-Call Controller Offline (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-controller.mjs'
      - 'swarm/smoke-six-call-controller.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_CONTROLLER_STATUS.md'
      - '.github/workflows/swarm-six-call-controller-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce dedicated branch and protected-path isolation
        run: node swarm/verify-isolation.mjs
      - name: Controller syntax checks
        run: |
          node --check swarm/smoke-six-call-controller.mjs
          node --check swarm/smoke-six-call-controller.test.mjs
      - name: Six-call limits, aborts, concurrent CAS and expiry (mock only)
        run: node --test swarm/smoke-six-call-controller.test.mjs
      - name: Assert production remains disconnected
        run: |
          ! grep -R -E "smoke-six-call-controller" worker-loop.mjs command-center/server.mjs swarm/cron.mjs swarm/runner.mjs
          echo 'NO_LIVE_DEPLOYMENT_NO_D1_WRITE_NO_INFERENCE'
