name: Guarded Latency Worker Rollout (One Shot)
on:
  push:
    branches: [main]
    paths:
      - 'release-candidates/latency-rollout-v1.txt'
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  rollout:
    if: ${{ github.event.head_commit.message == 'Trigger one-shot guarded latency rollout' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin correct account, Worker, and one-shot trigger
        run: |
          test "$(cat release-candidates/latency-rollout-v1.txt)" = 'approved-20261011-latency-v1' || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare token'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || { echo 'Wrong account'; exit 1; }
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.toml || exit 1
          grep -Fxq 'keep_vars = true' wrangler.toml || exit 1
          grep -Fxq 'binding = "AI"' wrangler.toml || exit 1
          grep -Fxq 'required = [ "DISCORD_PUBLIC_KEY" ]' wrangler.toml || exit 1
          grep -Fq "Discord GPT Relay ready (latency-v1)." worker-relay.mjs || exit 1
      - name: Regression tests
        run: node --test relay.test.mjs worker-relay.test.mjs
      - name: Check exact last working production version before modification
        run: |
          npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab > /tmp/discord-current-deployments.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = fs.readFileSync('/tmp/discord-current-deployments.txt', 'utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const found = [...data.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x => x[1]);
          const current = found.at(-1);
          if (current !== '82537b42-90d1-424d-92d4-9dcc5b1309de') {
            throw new Error('Live Worker version changed or cannot be verified; abort without deploying. Last version: ' + (current ?? 'UNKNOWN'));
          }
          console.log('Last user-tested working version is currently at 100%.');
          NODE
      - name: Promote only the verified inactive latency version
        id: promote
        run: |
          npx --yes wrangler@4 versions deploy \
            "f50669d7-7685-4da1-b2e5-567ae7526922@100%" \
            --name steep-glitter-b5cddiscord-ai-relay-lab \
            --message "Latency v1 improvement; guarded verification" --yes
      - name: Verify new version identity and Discord signature rejection
        id: verify
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const get = await fetch(url, {signal: AbortSignal.timeout(10000)});
              const body = await get.text();
              const unauthenticatedPost = await fetch(url, {
                method:'POST', body:'{}', signal: AbortSignal.timeout(10000)
              });
              console.log(JSON.stringify({
                attempt, getStatus:get.status, versionMatch:body.trim() === 'Discord GPT Relay ready (latency-v1).',
                unsignedPostStatus:unauthenticatedPost.status
              }));
              if (get.status === 200 && body.trim() === 'Discord GPT Relay ready (latency-v1).' &&
                  unauthenticatedPost.status === 401) process.exit(0);
            } catch(error) {
              console.log('Verification attempt ' + attempt + ': ' + String(error));
            }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw Error('Latency version not verified; automatic rollback required.');
          NODE
      - name: Automatic rollback to the last user-tested version if verification failed
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        run: |
          echo 'Health verification failed after promotion; restoring last known user-tested version.'
          npx --yes wrangler@4 versions deploy \
            "82537b42-90d1-424d-92d4-9dcc5b1309de@100%" \
            --name steep-glitter-b5cddiscord-ai-relay-lab \
            --message "Automatic rollback: latency version verification failed" --yes
      - name: Record post-release status
        if: ${{ success() }}
        run: echo 'New version health verified. Test /ask and /relay in Discord. Do not revoke DISCORD_PUBLIC_KEY.'
