name: Six-agent swarm isolated offline tests
on:
  push:
    branches: ['feature/isolated-six-agent-command-center-20261012']
    paths: ['.github/workflows/swarm-offline-tests.yml']
  pull_request:
    paths:
      - 'swarm/**'
      - '.github/workflows/swarm-offline-tests.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect existing Discord, YouTube and Project Love Machine paths
        run: node swarm/verify-isolation.mjs
      - name: Run six-agent SQLite state machine tests (NO CLOUDFLARE)
        run: node --test swarm/smoke-owner-approval.test.mjs swarm/smoke-historical-evidence-readonly.test.mjs swarm/smoke-reviewed-unknown-safe-off.test.mjs swarm/smoke-readonly-collector.test.mjs swarm/smoke-live-preflight.test.mjs swarm/model-result-diagnostics.test.mjs swarm/engine.test.mjs swarm/runner.test.mjs swarm/api.test.mjs swarm/portal.test.mjs swarm/quota.test.mjs swarm/cron.test.mjs swarm/handoff.test.mjs swarm/schema-readiness.test.mjs
      - name: Validate staged Workers AI adapter and neon HTML source
        run: |
          node --check swarm/engine.mjs
          node --check swarm/runner.mjs
          node --check swarm/model-result-diagnostics.mjs
          node --check swarm/smoke-owner-approval.mjs
          node --check swarm/smoke-historical-evidence-readonly.mjs
          node --check swarm/smoke-reviewed-unknown-safe-off.mjs
          node --check swarm/smoke-readonly-collector.mjs
          node --check swarm/api.mjs
          node --check swarm/portal.mjs
          node --check swarm/quota.mjs
          node --check swarm/cron.mjs
          node --check swarm/handoff.mjs
          node --check swarm/verify-isolation.mjs
          test -s swarm/command-center-preview.html
          echo 'OFFLINE_ONLY_PASS — no secrets, deploy, D1 migration or inference'
