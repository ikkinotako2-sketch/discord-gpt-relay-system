name: Emergency Restore Previous Llama Quality V2 (Manual Only)
on:
  workflow_dispatch:
    inputs:
      confirm_rollback:
        description: 'Type RESTORE-PREVIOUS to restore last proven working Discord Llama quality-v2 loop'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  restore:
    if: ${{ inputs.confirm_rollback == 'RESTORE-PREVIOUS' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials and account
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare token'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || { echo 'Wrong Cloudflare account'; exit 1; }
      - name: Restore last live-tested Discord Llama quality-v2 loop version
        run: |
          npx --yes wrangler@4 versions deploy \
            "91dd0014-179c-44b8-88ac-7084776f5e7b@100%" \
            --name steep-glitter-b5cddiscord-ai-relay-lab \
            --message "Restore previous user-tested Discord Llama quality-v2 from GPT-OSS pilot" --yes
      - name: Record deployment versions
        run: npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab
