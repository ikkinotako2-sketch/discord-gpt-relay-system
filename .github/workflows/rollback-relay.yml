name: Emergency Restore Last Working Relay (Manual Only)
on:
  workflow_dispatch:
    inputs:
      confirm_rollback:
        description: 'Type RESTORE-PREVIOUS to restore the pre-loop production Worker with new operator secret verified by read-only probe'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  restore:
    if: ${{ inputs.confirm_rollback == 'RESTORE-PREVIOUS' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials and account
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare token'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || { echo 'Wrong Cloudflare account'; exit 1; }
      - name: Restore the exact version that was live immediately before release
        run: |
          npx --yes wrangler@4 versions deploy \
            "b1b421c3-23fe-4a55-b8a7-db72b36848cc@100%" \
            --name steep-glitter-b5cddiscord-ai-relay-lab \
            --message "Restore last user-tested Discord relay version" --yes
      - name: Record deployment versions
        run: npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab
