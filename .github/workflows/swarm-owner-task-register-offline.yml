name: Discord Owner Reviewed Task Registration OFFLINE (NO D1 WRITE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-owner-task-register.mjs'
      - 'swarm/smoke-six-call-owner-task-register.test.mjs'
      - 'swarm/SMOKE_OWNER_TASK_REGISTER_REVIEW.md'
      - 'swarm/verify-isolation.mjs'
      - '.github/workflows/swarm-owner-task-register-offline.yml'
      - '.github/workflows/swarm-six-call-provider-boundary-offline.yml'
      - '.github/workflows/swarm-six-call-output-d1-offline.yml'
      - '.github/workflows/swarm-six-call-owner-task-source-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact eight-file reviewed registration/clock/PENDING-CAS scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-reviewed-task.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const allowed=new Set([
            'swarm/smoke-six-call-owner-task-register.mjs',
            'swarm/smoke-six-call-owner-task-register.test.mjs',
            'swarm/SMOKE_OWNER_TASK_REGISTER_REVIEW.md',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-owner-task-register-offline.yml',
            '.github/workflows/swarm-six-call-provider-boundary-offline.yml',
            '.github/workflows/swarm-six-call-output-d1-offline.yml',
            '.github/workflows/swarm-six-call-owner-task-source-offline.yml'
          ]);
          const postClaimRowDriftReview=new Set([
            'swarm/SMOKE_SIX_CALL_CONTROLLER_STATUS.md',
            'swarm/smoke-six-call-controller.mjs',
            'swarm/smoke-six-call-controller.test.mjs',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-six-call-owner-task-source-offline.yml',
            '.github/workflows/swarm-six-call-output-d1-offline.yml',
            '.github/workflows/swarm-six-call-provider-boundary-offline.yml',
            '.github/workflows/swarm-owner-task-register-offline.yml',
          ]);
          const postClaimRowDriftBranch=process.env.GITHUB_HEAD_REF==='fix/offline-postclaim-state-drift-20261028';
          const files=readFileSync('/tmp/changed-reviewed-task.txt','utf8').trim().split('\n');
          const branchOk=postClaimRowDriftBranch||['feature/discord-owner-task-registration-offline-20261028',
            'fix/offline-owner-review-async-timestamp-20261028','fix/offline-owner-task-pending-window-cas-20261028'].includes(process.env.GITHUB_HEAD_REF);
          const scope=postClaimRowDriftBranch?postClaimRowDriftReview:allowed;
          if(!branchOk||files.length!==scope.size||
             new Set(files).size!==scope.size||files.some(f=>!scope.has(f)))
            throw Error('UNREVIEWED_REGISTER_CODE_PATH');
          console.log('REVIEW_TASK_EIGHT_PATH_SCOPE_PASS');
          NODE
      - name: OAuth/CSRF and real local SQLite register tests, existing six call regression
        run: |
          node --check swarm/smoke-six-call-owner-task-register.mjs
          node --check swarm/smoke-six-call-owner-task-register.test.mjs
          node --test swarm/smoke-six-call-owner-task-register.test.mjs \
            swarm/smoke-six-call-owner-prepare.test.mjs \
            swarm/smoke-six-call-owner-task-source.test.mjs \
            swarm/smoke-six-call-provider-adapter.test.mjs \
            swarm/smoke-six-call-output-d1.test.mjs
      - name: No production routes or model/deploy calls
        run: |
          ! grep -R 'smoke-six-call-owner-task-register' worker-relay.mjs worker-loop.mjs swarm/api.mjs swarm/cron.mjs
          echo 'OWNER_TASK_REVIEW_REGISTER_OFFLINE_ONLY_NO_D1_LIVE_WRITES'
