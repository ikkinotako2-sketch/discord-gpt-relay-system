name: Loop Production Release (Approved One Shot)
on:
  push:
    branches: [main]
    paths:
      - 'preflight/loop-production-approved.once'
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event.head_commit.message == 'Deploy one-time approved Discord loop candidate' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_VERSION: aecc9c29-dbef-4abb-8036-3fd3bfbacc23
      CONFIRM: DEPLOY-LOOP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact target and credentials before ANY production write
        run: |
          test "$CONFIRM" = 'DEPLOY-LOOP' || exit 1
          test "$(cat preflight/loop-production-approved.once)" = "APPROVED_ONCE:aecc9c29-dbef-4abb-8036-3fd3bfbacc23" || { echo 'Release marker mismatch'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare Token absent'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || { echo 'Wrong account'; exit 1; }
          [[ "$TARGET_VERSION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || exit 1
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.loop.toml || exit 1
          grep -Fxq 'database_name = "discord-relay-loop-state"' wrangler.loop.toml || exit 1
          if grep -Fq 'REPLACE_WITH_' wrangler.loop.toml; then echo 'Missing isolated D1 ID'; exit 1; fi
      - name: Complete safety suite
        run: node --test relay.test.mjs worker-relay.test.mjs loop-core.test.mjs loop-worker.test.mjs loop-state.test.mjs loop-d1.test.mjs worker-loop.test.mjs
      - name: Verify last expected live deployment BEFORE replacing
        run: |
          npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab > /tmp/relay-deployments.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('/tmp/relay-deployments.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const ids=[...s.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          if(ids.at(-1)!=='b1b421c3-23fe-4a55-b8a7-db72b36848cc')throw Error('Unexpected live version. ABORT no deployment.');
          NODE
      - name: Promote explicitly approved inactive Worker version
        id: promote
        run: |
          npx --yes wrangler@4 versions deploy "$TARGET_VERSION@100%" \
            --name steep-glitter-b5cddiscord-ai-relay-lab \
            --message "Isolated Discord D1 loop, pre-cron deployment" --yes
      - name: Verify loop Worker, D1 migration, AI and allowlist are ready
        id: verify
        run: |
          node --input-type=module <<'NODE'
          const url='https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          for(let n=1;n<=12;n++){
            try{
              const get=await fetch(url,{signal:AbortSignal.timeout(10000)});
              const body=await get.text();
              const post=await fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(10000)});
              const healthy=get.status===200 && body.trim()==='Discord GPT Relay loop-v1 ready.' && post.status===401;
              console.log(JSON.stringify({attempt:n,http:get.status,loopVersion:body.trim()==='Discord GPT Relay loop-v1 ready.',unsignedPost:post.status}));
              if(healthy)process.exit(0);
            }catch(e){console.log('Health attempt '+n+' did not verify');}
            if(n<12)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw Error('Loop worker failed health verification; rollback required');
          NODE
      - name: Automatically restore last working Worker if post-deploy verification failed
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        run: |
          npx --yes wrangler@4 versions deploy \
            "b1b421c3-23fe-4a55-b8a7-db72b36848cc@100%" \
            --name steep-glitter-b5cddiscord-ai-relay-lab \
            --message "Restore last read-only-verified production version after loop health failure" --yes
      - name: Next staged steps (no Cron or slash command registration yet)
        if: ${{ success() }}
        run: echo 'Loop Worker is healthy. Register loop slash commands separately, then enable Cron. /ask and /relay must also be retested.'
