name: Discord Watchdog Prearm-Safe Code PARKED Release Once
on:
  push:
    branches: [deploy/discord-watchdog-parked-20261015]
    paths: ['.github/workflows/discord-watchdog-prearm-code-parked-once.yml']
permissions: { contents: read }
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  isolated-code-only:
    if: ${{ github.event.head_commit.message == 'Deploy improved isolated Discord Watchdog PARKED once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_D1_READ_TOKEN: ${{ secrets.DISCORD_D1_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8357494c7204c7d4939caddf902707430719713
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact primary Worker and parked, clean state before changing only watchdog
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ikkinotako2-sketch/discord-gpt-relay-system'
          test "$GITHUB_REF" = 'refs/heads/deploy/discord-watchdog-parked-20261015'
          grep -Fq "PREARM_TO_CAPTURE_SMOKE_DEPLOYMENT" swarm/smoke-watchdog-core.mjs
          grep -Fq "PREARM_TO_CAPTURE_SMOKE_DEPLOYMENT" swarm/smoke-watchdog-worker.mjs
          grep -Fxq 'name = "discord-smoke-independent-watchdog-staged"' swarm/wrangler.watchdog.example.toml
          grep -Fxq 'workers_dev = false' swarm/wrangler.watchdog.example.toml
          grep -Fxq 'WATCHDOG_ARMED = "false"' swarm/wrangler.watchdog.example.toml
          grep -Fxq 'WATCHDOG_APPROVAL = "NOT_APPROVED"' swarm/wrangler.watchdog.example.toml
          node --test swarm/smoke-watchdog.test.mjs swarm/smoke-watchdog-alarm.test.mjs swarm/smoke-restore-executor.test.mjs
          node --input-type=module <<'NODE'
          import {createDiscordD1ReadClient} from './swarm/smoke-watchdog-d1.mjs';
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/';
          const watch='discord-smoke-independent-watchdog-staged';
          const primary='steep-glitter-b5cddiscord-ai-relay-lab';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(script,suffix){
            const r=await fetch(root+script+suffix,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(13000)});
            if(r.status!==200)throw Error('REMOTE_READ_HTTP_'+r.status+'_'+suffix);
            const obj=await r.json();if(obj.success!==true||!obj.result)throw Error('REMOTE_READ_INVALID');
            return obj.result;
          }
          const [ps,deploy,ws,secrets,cron,d1]=await Promise.all([
            get(primary,'/settings'),get(primary,'/deployments'),
            get(watch,'/settings'),get(watch,'/secrets'),get(watch,'/schedules'),
            createDiscordD1ReadClient({token:process.env.CF_D1_READ_TOKEN}).snapshot()
          ]);
          const live=deploy?.deployments?.[0];
          if(live?.versions?.length!==1||live.versions[0].percentage!==100||
             live.versions[0].version_id!=='18c379e8-e759-4b2f-8300-e7a4c8b39b83')
             throw Error('LIVE_DISCORD_BASELINE_CHANGED');
          if(!Array.isArray(ps?.bindings)||!Array.isArray(ws?.bindings)||!Array.isArray(secrets)||
             !Array.isArray(cron?.schedules)||!d1.clean)throw Error('PRODUCTION_STATE_UNVERIFIED');
          const exact=(bs,k,v)=>{
            const rows=bs.filter(x=>x?.name===k);
            if(rows.length!==1||rows[0].type!=='plain_text'||rows[0].text!==v)
              throw Error('UNEXPECTED_REMOTE_SETTING_'+k);
          };
          for(const k of ['SWARM_API_ENABLED','SWARM_RUNNER_ENABLED','SWARM_EXECUTION_APPROVED','SWARM_EXCLUSIVE_MODE']){
            const rows=ps.bindings.filter(x=>x?.name===k);
            if(rows.length>1||rows.some(x=>x.type!=='plain_text'||x.text!=='false'))
              throw Error('DISCORD_SWARM_LIVE_NOT_OFF');
          }
          for(const [k,v] of [
            ['WATCHDOG_ARMED','false'],['WATCHDOG_APPROVAL','NOT_APPROVED'],
            ['WATCHDOG_BASELINE_VERSION','UNSET'],['WATCHDOG_SMOKE_VERSION','UNSET'],
            ['WATCHDOG_EXPECTED_DEPLOYMENT_ID','UNSET'],['WATCHDOG_EXPIRES_AT','UNSET']
          ])exact(ws.bindings,k,v);
          for(const k of ['WATCHDOG_RESTORE_TOKEN','WATCHDOG_D1_READ_TOKEN'])
            if(secrets.filter(x=>x.name===k).length!==1)throw Error('MISSING_WATCHDOG_SCOPED_SECRET');
          if(cron.schedules.length!==1||cron.schedules[0].cron!=='* * * * *')
            throw Error('WATCHDOG_CRON_NOT_STANDALONE');
          console.log('GUARDED_WATCHDOG_PARKED_RELEASE_PREFLIGHT_PASS');
          NODE
      - name: Deploy changed independent Watchdog code with flags OFF
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 deploy --config swarm/wrangler.watchdog.example.toml
      - name: Verify only standalone Watchdog version changed and its own flags remain OFF
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(script,suffix){
            const r=await fetch(root+script+suffix,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(13000)});
            if(r.status!==200)throw Error('POSTCHECK_READ_HTTP_'+r.status);
            const body=await r.json();
            if(body.success!==true||!body.result)throw Error('POSTCHECK_RESULT_MISSING');
            return body.result;
          }
          const [primary,ws,secrets,cron,deployed]=await Promise.all([
            get('steep-glitter-b5cddiscord-ai-relay-lab','/deployments'),
            get('discord-smoke-independent-watchdog-staged','/settings'),
            get('discord-smoke-independent-watchdog-staged','/secrets'),
            get('discord-smoke-independent-watchdog-staged','/schedules'),
            get('discord-smoke-independent-watchdog-staged','/deployments')
          ]);
          if(primary?.deployments?.[0]?.versions?.length!==1||
             primary.deployments[0].versions[0].version_id!=='18c379e8-e759-4b2f-8300-e7a4c8b39b83')
             throw Error('PRIMARY_DISCORD_CHANGED_AFTER_WATCHDOG_UPDATE');
          if(!Array.isArray(ws?.bindings)||!Array.isArray(secrets)||
             !Array.isArray(cron?.schedules)||!deployed?.deployments?.length)
             throw Error('WATCHDOG_POSTCHECK_MISSING');
          for(const [k,v] of [
            ['WATCHDOG_ARMED','false'],['WATCHDOG_APPROVAL','NOT_APPROVED'],
            ['WATCHDOG_BASELINE_VERSION','UNSET'],['WATCHDOG_SMOKE_VERSION','UNSET'],
            ['WATCHDOG_EXPECTED_DEPLOYMENT_ID','UNSET'],['WATCHDOG_EXPIRES_AT','UNSET']
          ]){
            const rows=ws.bindings.filter(x=>x?.name===k);
            if(rows.length!==1||rows[0].type!=='plain_text'||rows[0].text!==v)
              throw Error('WATCHDOG_UNEXPECTED_POST_DEPLOY_SETTING_'+k);
          }
          for(const k of ['WATCHDOG_D1_READ_TOKEN','WATCHDOG_RESTORE_TOKEN'])
            if(secrets.filter(x=>x.name===k).length!==1)
              throw Error('WATCHDOG_SECRET_LOST_'+k);
          if(cron.schedules.length!==1||cron.schedules[0].cron!=='* * * * *')
            throw Error('WATCHDOG_CRON_CHANGED');
          console.log('PREARM_CAPABLE_WATCHDOG_DEPLOYED_PARKED_OFF');
          console.log('EXISTING_DISCORD_VERSION_UNCHANGED');
          console.log('NO_AI_NO_D1_WRITE_NO_OTHER_PROJECT_CHANGE');
          NODE
