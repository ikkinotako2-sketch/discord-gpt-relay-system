name: Discord Loop Readiness Probe (Read Only)
on:
  push:
    branches: [main]
    paths:
      - 'preflight/discord-owner-secret-check.once'
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.event.head_commit.message == 'Run one-time read-only Discord Worker readiness probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check expected account and isolated D1 target without writes
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.loop.toml || exit 1
          grep -Fxq 'database_name = "discord-relay-loop-state"' wrangler.loop.toml || exit 1
          grep -Fxq 'database_id = "d80b08a4-0ff7-4320-9575-0d3c55cf7aba"' wrangler.loop.toml || exit 1
      - name: Inspect live Worker deployment without changes
        run: |
          npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab > /tmp/discord-relay-deployments.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/discord-relay-deployments.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const found=[...raw.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          if(!found.length)throw Error('Could not establish exact live version; STOP before release');
          console.log('LIVE_DEPLOYMENT_VERSION='+found.at(-1));
          console.log('LIVE_DEPLOYMENT_IS_KNOWN_LATENCY_BASELINE='+String(found.at(-1)==='f50669d7-7685-4da1-b2e5-567ae7526922'));
          NODE
      - name: Inspect required Worker secret NAMES only (no values)
        run: |
          npx --yes wrangler@4 secret list --name steep-glitter-b5cddiscord-ai-relay-lab --format json > /tmp/discord-relay-secrets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/discord-relay-secrets.json','utf8'));
          if(!Array.isArray(data))throw Error('Unexpected Cloudflare secret inventory');
          const names=new Set(data.map(x=>x.name));
          const required=['DISCORD_PUBLIC_KEY','DISCORD_ALLOWED_USER_ID'];
          for(const name of required)console.log(name+'_PRESENT='+String(names.has(name)));
          console.log('EXPOSED_SETUP_KEY_STILL_PRESENT='+String(names.has('SETUP_KEY')));
          console.log('LEGACY_WORKER_BOT_TOKEN_PRESENT='+String(names.has('DISCORD_BOT_TOKEN')));
          if(required.some(n=>!names.has(n)))throw Error('Required secret name missing. No deployment permitted.');
          NODE
      - name: Test public GET and reject unsigned Discord POST
        run: |
          node --input-type=module <<'NODE'
          const url='https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
          const text=await r.text();
          const p=await fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(12000)});
          console.log('GET_STATUS='+r.status);
          console.log('LIVE_LEGACY_HEALTH_MARKER='+String(text.trim()==='Discord GPT Relay ready (latency-v1).'));
          console.log('UNSIGNED_POST_STATUS='+p.status);
          if(r.status!==200||p.status!==401)throw Error('Existing Worker health or signature rejection failed');
          NODE
      - name: Finish
        run: echo 'READ_ONLY_PROBE_COMPLETE: No production or D1 changes, no AI calls.'
