name: Discord Watchdog Dedicated D1 Read Secret One-shot
on:
  push:
    branches: [deploy/discord-watchdog-parked-20261015]
    paths: ['.github/workflows/discord-watchdog-d1-read-secret-once.yml']
permissions:
  contents: read
concurrency:
  group: discord-independent-watchdog-secret-once
  cancel-in-progress: false
jobs:
  safe-d1-secret:
    if: ${{ github.event.head_commit.message == 'Approve isolated Discord watchdog D1 read binding once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_D1_READ_TOKEN: ${{ secrets.DISCORD_D1_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify solely the parked Discord Watchdog and D1 read access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ikkinotako2-sketch/discord-gpt-relay-system'
          test "$GITHUB_REF" = 'refs/heads/deploy/discord-watchdog-parked-20261015'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CF_D1_READ_TOKEN"
          node --input-type=module <<'NODE'
          import {createDiscordD1ReadClient} from './swarm/smoke-watchdog-d1.mjs';
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const primary='steep-glitter-b5cddiscord-ai-relay-lab';
          const script='discord-smoke-independent-watchdog-staged';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(uri){
            const r=await fetch(uri,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
            if(r.status!==200)throw Error('READ_HTTP_'+r.status);
            const data=await r.json();
            if(data.success!==true)return null;
            return data.result;
          }
          const [settings,secretNames,original]=await Promise.all([
            get(root+script+'/settings'),get(root+script+'/secrets'),
            get(root+primary+'/settings')
          ]);
          if(!Array.isArray(settings?.bindings)||!Array.isArray(secretNames)||
            !Array.isArray(original?.bindings))throw Error('SETTINGS_OR_SECRETS_NOT_VERIFIED');
          for(const [key,expected] of [['WATCHDOG_ARMED','false'],['WATCHDOG_APPROVAL','NOT_APPROVED']]){
            const xs=settings.bindings.filter(b=>b?.name===key);
            if(xs.length!==1||xs[0].type!=='plain_text'||xs[0].text!==expected)
              throw Error('WATCHDOG_NOT_PARKED_'+key);
          }
          for(const name of ['WATCHDOG_D1_READ_TOKEN','WATCHDOG_RESTORE_TOKEN']){
            if(secretNames.some(s=>s.name===name))throw Error('WATCHDOG_SECRET_ALREADY_SET_'+name);
          }
          for(const key of ['SWARM_API_ENABLED','SWARM_RUNNER_ENABLED','SWARM_EXECUTION_APPROVED','SWARM_EXCLUSIVE_MODE']){
            const xs=original.bindings.filter(b=>b?.name===key);
            if(xs.length>1||(xs.length===1&&(xs[0].type!=='plain_text'||xs[0].text!=='false')))
              throw Error('PRIMARY_SWARM_FLAG_NOT_OFF_'+key);
          }
          const snap=await createDiscordD1ReadClient({token:process.env.CF_D1_READ_TOKEN}).snapshot();
          if(!snap.clean)throw Error('DEDICATED_DISCORD_DB_NOT_CLEAN');
          console.log('DISCORD_WATCHDOG_D1_SECRET_PREFLIGHT_PASS_NO_SECRET_VALUE_OUTPUT');
          NODE
      - name: Bind only existing dedicated Discord D1 READ token to parked Watchdog
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CF_D1_READ_TOKEN" | npx --yes wrangler@4.119.0 secret put WATCHDOG_D1_READ_TOKEN --name discord-smoke-independent-watchdog-staged --config swarm/wrangler.watchdog.example.toml
      - name: Verify only D1 READ name added and watchdog stays disarmed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account='6c8ccd6aface937ab5dabef61cb64534';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/discord-smoke-independent-watchdog-staged';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function get(path){
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
            if(r.status!==200)throw Error('POSTCHECK_HTTP_'+r.status);
            const data=await r.json();
            if(data.success!==true)return null;
            return data.result;
          }
          const [secrets,settings,schedules]=await Promise.all([
            get('/secrets'),get('/settings'),get('/schedules')
          ]);
          if(!Array.isArray(secrets)||!Array.isArray(settings?.bindings)||
             !Array.isArray(schedules?.schedules))throw Error('POSTCHECK_NOT_VERIFIED');
          if(secrets.filter(x=>x?.name==='WATCHDOG_D1_READ_TOKEN').length!==1)
            throw Error('READ_ONLY_SECRET_NOT_INSTALLED');
          if(secrets.some(x=>x?.name==='WATCHDOG_RESTORE_TOKEN'))
            throw Error('UNAPPROVED_RESTORE_SECRET_PRESENT');
          function exact(k,v){
            const a=settings.bindings.filter(b=>b?.name===k);
            if(a.length!==1||a[0].text!==v||a[0].type!=='plain_text')throw Error('WATCHDOG_UNEXPECTED_'+k);
          }
          exact('WATCHDOG_ARMED','false');
          exact('WATCHDOG_APPROVAL','NOT_APPROVED');
          if(schedules.schedules.length!==1||schedules.schedules[0].cron!=='* * * * *')
            throw Error('WATCHDOG_SCHEDULE_CHANGED');
          console.log('DISCORD_WATCHDOG_D1_READ_SECRET_BOUND_AND_PARKED_VERIFIED');
          console.log('NO_PRIMARY_WORKER_CHANGE_NO_AI_INFERENCE_NO_D1_WRITES_NO_RESTORE_TOKEN');
          NODE
