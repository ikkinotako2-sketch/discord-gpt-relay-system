name: Register Loop Commands (Verified Live Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discord-relay-command-registration
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm new loop Worker is actually live and ready
        run: |
          node --input-type=module <<'NODE'
          const url='https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/';
          let good=false;
          for(let n=0;n<10;n++){
            try {
              const get=await fetch(url,{signal:AbortSignal.timeout(10000)});
              const body=await get.text();
              const post=await fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(10000)});
              if(get.status===200 && body.trim()==='Discord GPT Relay loop-v1 ready.' && post.status===401){
                good=true;break;
              }
            }catch{}
            if(n<9) await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!good)throw Error('Loop D1/AI/owner or production deployment not ready: registration BLOCKED');
          console.log('Live loop Worker health and signature-gate validated');
          NODE
      - name: Register ONLY /loop, /loop-status, and /loop-stop
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token=process.env.DISCORD_BOT_TOKEN;
          if(!token)throw Error('Discord token secret missing');
          const appId='1558705011339427840';
          const me=await fetch('https://discord.com/api/v10/users/@me',{
            headers:{Authorization:'Bot '+token}});
          if(!me.ok)throw Error('Bot authentication HTTP '+me.status);
          const bot=await me.json();
          if(!bot.bot || bot.id!==appId)throw Error('Wrong Discord application');
          const commands=JSON.parse(fs.readFileSync('discord/loop-commands.json','utf8'));
          if(commands.length!==3 || commands.map(c=>c.name).join(',')!=='loop,loop-status,loop-stop')
            throw Error('Unexpected command definition');
          for(const command of commands){
            const result=await fetch('https://discord.com/api/v10/applications/'+appId+'/commands',{
              method:'POST',
              headers:{Authorization:'Bot '+token,'Content-Type':'application/json'},
              body:JSON.stringify(command)
            });
            if(!result.ok)throw Error('Command registration for '+command.name+' returned '+result.status);
            console.log('Registered /'+command.name+' via status '+result.status);
          }
          console.log('Existing /ask and /relay commands not replaced');
          NODE
