name: Discord Six-Call Post-Claim STOP & Migration Backup OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-controller.mjs'
      - 'swarm/smoke-six-call-postclaim-stop.test.mjs'
      - 'swarm/smoke-six-call-migration-acceptance.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_POSTCLAIM_STOP_REVIEW.md'
      - '.github/workflows/swarm-six-call-postclaim-stop-offline.yml'
permissions:
  contents: read
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove reviewed six-file isolation
        run: node swarm/verify-isolation.mjs
      - name: Syntax checks
        run: |
          node --check swarm/smoke-six-call-controller.mjs
          node --check swarm/smoke-six-call-postclaim-stop.test.mjs
          node --check swarm/smoke-six-call-migration-acceptance.test.mjs
      - name: Cross-layer full SQLite STOP, provider races, migration backup recovery
        run: |
          node --test swarm/smoke-six-call-postclaim-stop.test.mjs \
            swarm/smoke-six-call-migration-acceptance.test.mjs \
            swarm/smoke-six-call-controller.test.mjs \
            swarm/smoke-six-call-d1-store.test.mjs \
            swarm/smoke-six-call-stop-reconcile.test.mjs \
            swarm/smoke-six-call-d1-ddl-digest.test.mjs
      - name: Ensure zero production imports or Cloudflare credentials
        run: |
          ! grep -R -E "smoke-six-call-postclaim-stop|smoke-six-call-migration-acceptance" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'LOCAL_SQLITE_POSTCLAIM_STOP_AND_BACKUP_RECOVERY_NO_LIVE_AUTHORITY'
