name: Discord Workers AI GraphQL Schema and Neuron Read Only 20261027
on:
  push:
    branches: [audit/discord-d1-watchdog-readonly-20261027-once]
    paths:
      - '.github/workflows/discord-ai-neuron-graphql-schema-readonly-20261027.yml'
permissions:
  contents: read
concurrency:
  group: discord-ai-graphql-schema-readonly-20261027-once
  cancel-in-progress: false
jobs:
  account_readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 341884e8628cf4ce8749271b63a9cece4572e93a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GET-equivalent read-only GraphQL introspection and account neuron aggregation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const accountTag='6c8ccd6aface937ab5dabef61cb64534';
          const day='2026-10-27';
          if(new Date().toISOString().slice(0,10)!==day)
            throw Error('UTC_ONE_DAY_AUDIT_EXPIRED');
          if(!token){console.log('GRAPHQL_TOKEN=MISSING');process.exit(0);}
          async function query(query,variables={}){
            const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{
              method:'POST',headers:{
                Authorization:'Bearer '+token,
                'Content-Type':'application/json'
              },
              body:JSON.stringify({query,variables}),
              signal:AbortSignal.timeout(14000)
            });
            const status=response.status;
            const body=status===200?await response.json():null;
            return {status,body};
          }
          const introspection='query ReadSchemaOnly{__schema{types{name}}}';
          try{
            const a=await query(introspection);
            console.log('INTROSPECTION_HTTP='+a.status);
            console.log('INTROSPECTION_ERRORS='+(Array.isArray(a.body?.errors)?a.body.errors.length:'UNVERIFIED'));
            const types=a.body?.data?.__schema?.types;
            if(Array.isArray(types)){
              const matches=types.filter(x=>typeof x.name==='string'&&
                /aiinference|neuron/i.test(x.name));
              console.log('AI_NEURON_SCHEMA_TYPE_COUNT='+matches.length);
              console.log('AI_NEURON_SCHEMA_TYPES='+matches.slice(0,18).map(x=>x.name).join(','));
            }else console.log('AI_NEURON_SCHEMA_TYPES=UNVERIFIED');
          }catch{console.log('INTROSPECTION=UNVERIFIED');}
          const read='query WorkerAiAccountNeurons($accountTag:string!,$start:Time!,$end:Time!){viewer{accounts(filter:{accountTag:$accountTag}){aiInferenceAdaptiveGroups(limit:10,filter:{datetime_gt:$start,datetime_lt:$end}){count sum{totalNeurons}}}}}';
          for(const [name,start,end] of [
            ['CURRENT_UTC_DAY',day+'T00:00:00Z',new Date().toISOString()],
            ['KNOWN_PRIOR_DAY','2026-10-24T00:00:00Z','2026-10-25T00:00:00Z']
          ]){
            try{
              const result=await query(read,{accountTag,start,end});
              console.log(name+'_HTTP='+result.status);
              console.log(name+'_GRAPHQL_ERRORS='+
                (Array.isArray(result.body?.errors)?result.body.errors.length:'UNVERIFIED'));
              const accounts=result.body?.data?.viewer?.accounts;
              console.log(name+'_ACCOUNT_ROWS='+(Array.isArray(accounts)?accounts.length:'UNVERIFIED'));
              const rows=Array.isArray(accounts)&&accounts.length===1?
                accounts[0]?.aiInferenceAdaptiveGroups:null;
              console.log(name+'_AGGREGATE_ROWS='+(Array.isArray(rows)?rows.length:'UNVERIFIED'));
              if(Array.isArray(rows)&&rows.length>0&&rows.length<=10){
                const nums=rows.map(x=>x?.sum?.totalNeurons);
                const valid=nums.every(x=>typeof x==='number'&&Number.isFinite(x)&&x>=0);
                console.log(name+'_OBSERVED_NEURONS='+
                  (valid?nums.reduce((a,b)=>a+b,0):'UNVERIFIED'));
                console.log(name+'_COUNT='+
                  (rows.every(x=>Number.isSafeInteger(x.count)&&x.count>=0)?
                    rows.reduce((a,b)=>a+b.count,0):'UNVERIFIED'));
              }
            }catch{console.log(name+'_READ=UNVERIFIED');}
          }
          console.log('EMPTY_ROWS_ARE_NOT_PROOF_OF_ZERO_USAGE=true');
          console.log('ACCOUNT_FREE_NEURONS_REMAINING=UNVERIFIED');
          console.log('MODEL_ENTITLEMENT=UNVERIFIED');
          console.log('AI_RUN_REQUESTS=0');
          console.log('D1_WRITES=0');
          console.log('PRODUCTION_INFERENCE_AUTHORIZED=false');
          NODE
