name: Discord Six-Call Quota Evidence OFFLINE (NO LIVE)
on:
  pull_request:
    paths:
      - 'swarm/smoke-six-call-free-neuron-review.mjs'
      - 'swarm/smoke-six-call-free-neuron-review.test.mjs'
      - 'swarm/smoke-six-call-readiness-report.mjs'
      - 'swarm/smoke-six-call-readiness-report.test.mjs'
      - 'swarm/verify-isolation.mjs'
      - 'swarm/SMOKE_SIX_CALL_FREE_NEURON_READINESS.md'
      - '.github/workflows/swarm-six-call-quota-evidence-offline.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact seven-file isolation
        run: node swarm/verify-isolation.mjs
      - name: Validate source and test syntax
        run: |
          node --check swarm/smoke-six-call-free-neuron-review.mjs
          node --check swarm/smoke-six-call-free-neuron-review.test.mjs
          node --check swarm/smoke-six-call-readiness-report.mjs
          node --check swarm/smoke-six-call-readiness-report.test.mjs
      - name: Fail-closed quota and safety evidence tests (NO AI)
        run: |
          node --test swarm/smoke-six-call-free-neuron-review.test.mjs \
            swarm/smoke-six-call-readiness-report.test.mjs \
            swarm/smoke-six-call-release-fence.test.mjs \
            swarm/smoke-six-call-stop-reconcile.test.mjs
      - name: Assert no production wiring
        run: |
          ! grep -R -E "smoke-six-call-free-neuron-review|smoke-six-call-readiness-report" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'FREE_NEURON_AND_READINESS_REVIEW_OFFLINE_ONLY_NO_INFERENCE'
