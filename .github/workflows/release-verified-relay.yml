name: Release Verified Discord Relay
on:
  workflow_dispatch:
    inputs:
      approve:
        description: 'Type RELEASE to acknowledge production traffic will change'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  release:
    if: ${{ inputs.approve == 'RELEASE' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight offline tests
        run: node --test relay.test.mjs worker-relay.test.mjs
      - name: Validate accounts, token, and fixed release identity
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || { echo "Unexpected Cloudflare account ID"; exit 1; }
          test -n "$DISCORD_BOT_TOKEN" || { echo "Missing DISCORD_BOT_TOKEN (not deploying)"; exit 1; }
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.toml || exit 1
          grep -Fxq 'keep_vars = true' wrangler.toml || exit 1
      - name: Verify Discord bot token (no secret printed)
        run: |
          status="$(curl -sS -o /tmp/discord-user.json -w '%{http_code}' -H "Authorization: Bot $DISCORD_BOT_TOKEN" https://discord.com/api/v10/users/@me)"
          test "$status" = 200 || { echo "Discord authentication HTTP $status"; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('/tmp/discord-user.json','utf8')); if (!a.bot) throw Error('Token is not a Bot token')"
          rm -f /tmp/discord-user.json
      - name: Capture previous deployment metadata for manual rollback
        run: npx --yes wrangler@4 deployments list --name steep-glitter-b5cddiscord-ai-relay-lab
      - name: Promote only the previously uploaded version
        run: |
          npx --yes wrangler@4 versions deploy "82537b42-90d1-424d-92d4-9dcc5b1309de@100%" \
            --name steep-glitter-b5cddiscord-ai-relay-lab \
            --message "Approved Discord relay v1" --yes
      - name: Check that the Worker responds
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/ \
            -o /tmp/worker-health.txt
          grep -Fq 'Discord GPT Relay candidate' /tmp/worker-health.txt || exit 1
      - name: Register only /relay, do not replace /ask
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const command = JSON.parse(fs.readFileSync('discord/relay-command.json','utf8'));
          if (command.name !== 'relay' || command.type !== 1) throw new Error('Unexpected command definition');
          const response = await fetch('https://discord.com/api/v10/applications/1558705011339427840/commands', {
            method: 'POST',
            headers: {
              'Authorization': 'Bot ' + process.env.DISCORD_BOT_TOKEN,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(command)
          });
          if (!response.ok) {
            console.error('Discord API returned', response.status);
            throw new Error('Registration unsuccessful; Worker code was deployed; examine logs and retry registration separately');
          }
          console.log('/relay registration accepted:', response.status);
          NODE
      - name: Post-release
        run: echo "Deployment and command registration completed. Manually test /ask and /relay in Discord. Revoke SETUP_KEY from the live Worker."
