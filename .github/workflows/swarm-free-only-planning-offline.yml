name: Discord Free-only Six Call Evidence OFFLINE (No Model Calls)
on:
  pull_request:
    paths:
      - 'swarm/smoke-free-only-planning.mjs'
      - 'swarm/smoke-free-only-planning.test.mjs'
      - 'swarm/SMOKE_FREE_ONLY_READINESS.md'

      - '.github/workflows/swarm-free-only-planning-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject changes outside two exact offline-only reviewed change sets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/free-only-paths.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const allowed=new Set([
            'swarm/smoke-free-only-planning.mjs',
            'swarm/smoke-free-only-planning.test.mjs',
            'swarm/SMOKE_FREE_ONLY_READINESS.md',
            'swarm/verify-isolation.mjs',
            '.github/workflows/swarm-free-only-planning-offline.yml'
          ]);
          const changes=readFileSync('/tmp/free-only-paths.txt','utf8').trim().split('\n');
          const providerAdapterReview=new Set([
            'swarm/smoke-six-call-provider-adapter.mjs',
            'swarm/smoke-six-call-provider-adapter.test.mjs',
            'swarm/SMOKE_PROVIDER_BOUNDARY_READINESS.md',
            '.github/workflows/swarm-six-call-provider-boundary-offline.yml',
            '.github/workflows/swarm-free-only-planning-offline.yml',
            'swarm/verify-isolation.mjs'
          ]);
          const outputD1Review=new Set([
            'swarm/smoke-six-call-output-artifacts.review.sql',
            'swarm/smoke-six-call-output-d1.mjs',
            'swarm/smoke-six-call-output-d1.test.mjs',
            'swarm/SMOKE_SIX_CALL_OUTPUT_D1_READINESS.md',
            '.github/workflows/swarm-six-call-output-d1-offline.yml',
            '.github/workflows/swarm-six-call-provider-boundary-offline.yml',
            '.github/workflows/swarm-free-only-planning-offline.yml',
            'swarm/verify-isolation.mjs'
          ]);
          const match=s=>changes.length===s.size&&
            new Set(changes).size===s.size&&changes.every(p=>s.has(p));
          if(!match(allowed)&&!match(providerAdapterReview)&&!match(outputD1Review))
            throw Error('UNREVIEWED_CHANGE_SCOPE');
          console.log('OFFLINE_FREE_OR_PROVIDER_REVIEW_STRICT_SCOPE_PASS');
          NODE
      - name: No production deployment, billing or AI inference
        run: |
          node --check swarm/smoke-free-only-planning.mjs
          node --check swarm/smoke-free-only-planning.test.mjs
          node --test swarm/smoke-free-only-planning.test.mjs \
            swarm/smoke-six-call-free-neuron-review.test.mjs \
            swarm/smoke-six-call-controller.test.mjs \
            swarm/smoke-six-call-postclaim-stop.test.mjs \
            swarm/smoke-six-call-migration-acceptance.test.mjs
          ! grep -R "smoke-free-only-planning" worker-loop.mjs command-center/server.mjs swarm/api.mjs swarm/runner.mjs swarm/cron.mjs
          echo 'FREE_ONLY_NO_PAID_UPGRADE_NO_AI_CALL_OFFLINE_PASS'
