name: GPT OSS Pilot Inactive Upload Once
on:
  push:
    branches: [main]
    paths:
      - 'preflight/gpt-oss-pilot-upload.once'
permissions:
  contents: read
concurrency:
  group: discord-relay-version-upload
  cancel-in-progress: false
jobs:
  upload:
    if: ${{ github.event.head_commit.message == 'Trigger approved GPT OSS pilot inactive upload once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_VERSION: 91dd0014-179c-44b8-88ac-7084776f5e7b
      WORKER_NAME: steep-glitter-b5cddiscord-ai-relay-lab
      WORKER_URL: https://steep-glitter-b5cddiscord-ai-relay-lab.ikkinotako2.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate marker, credentials and exact GPT-OSS candidate target
        run: |
          set -euo pipefail
          test "$(cat preflight/gpt-oss-pilot-upload.once)" = 'INACTIVE_ONLY:GPT_OSS_20B:ONE_SHOT'
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '6c8ccd6aface937ab5dabef61cb64534' || exit 1
          grep -Fxq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.gpt-oss.toml
          grep -Fxq 'main = "worker-loop.mjs"' wrangler.gpt-oss.toml
          grep -Fxq 'keep_vars = true' wrangler.gpt-oss.toml
          grep -Fxq 'binding = "AI"' wrangler.gpt-oss.toml
          grep -Fxq 'database_name = "discord-relay-loop-state"' wrangler.gpt-oss.toml
          grep -Fxq 'database_id = "d80b08a4-0ff7-4320-9575-0d3c55cf7aba"' wrangler.gpt-oss.toml
          grep -Fxq 'crons = ["*/1 * * * *"]' wrangler.gpt-oss.toml
          grep -Fxq 'LOOP_AI_MODEL = "@cf/openai/gpt-oss-20b"' wrangler.gpt-oss.toml
          grep -Fq 'DISCORD_PUBLIC_KEY' wrangler.gpt-oss.toml
          grep -Fq 'DISCORD_ALLOWED_USER_ID' wrangler.gpt-oss.toml
          grep -Fq 'Discord GPT Relay gpt-oss pilot ready.' worker-loop.mjs
          grep -Fq 'resolveLoopModel(env)' worker-loop.mjs
      - name: Verify Llama quality-v2 is still live before upload
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --name "$WORKER_NAME" > /tmp/gptoss-before.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('/tmp/gptoss-before.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const versions=[...s.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          if(versions.at(-1)!==process.env.EXPECTED_VERSION)throw Error('Unexpected live version: NO UPLOAD.');
          console.log('Exact current production quality-v2 still at 100%.');
          NODE
          node --input-type=module <<'NODE'
          const url=process.env.WORKER_URL;
          const g=await fetch(url,{signal:AbortSignal.timeout(12000)});
          const txt=await g.text();
          const p=await fetch(url,{method:'POST',body:'{}',signal:AbortSignal.timeout(12000)});
          if(g.status!==200||txt.trim()!=='Discord GPT Relay loop-v2 task-focus ready.'||p.status!==401)
            throw Error('Existing Worker health failed. Stop.');
          console.log('Production v2 healthy, unsigned Discord POST rejected.');
          NODE
      - name: Run all existing and GPT-OSS unit tests (NO model inference)
        run: |
          node --test relay.test.mjs worker-relay.test.mjs loop-core.test.mjs loop-worker.test.mjs loop-state.test.mjs loop-d1.test.mjs worker-loop.test.mjs loop-quality.test.mjs
      - name: Dry run compile with GPT-OSS setting
        run: |
          npx --yes wrangler@4 deploy --dry-run --config wrangler.gpt-oss.toml --outdir /tmp/discord-gptoss-pilot
      - name: Upload inactive candidate only, no traffic or Cron modification
        run: |
          npx --yes wrangler@4 versions upload --config wrangler.gpt-oss.toml --message "OpenAI gpt-oss-20b pilot inactive preview; no production rollout"
      - name: Reverify live traffic was not changed
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --name "$WORKER_NAME" > /tmp/gptoss-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('/tmp/gptoss-after.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const versions=[...s.matchAll(/Version\(s\):\s+\(100%\)\s+([0-9a-f-]{36})/gi)].map(x=>x[1]);
          if(versions.at(-1)!==process.env.EXPECTED_VERSION)
            throw Error('Live Worker version changed unexpectedly: investigate without automatic writes.');
          console.log('INACTIVE_GPT_OSS_UPLOADED: production Llama traffic unchanged. No live model call performed.');
          NODE
