name: Manual Cloudflare Deployment
on:
  workflow_dispatch:
    inputs:
      confirm_worker:
        description: 'Type the exact target Worker name to approve deployment'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: discord-relay-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirm_worker == 'steep-glitter-b5cddiscord-ai-relay-lab' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline tests before deployment
        run: node --test relay.test.mjs worker-relay.test.mjs
      - name: Verify approved target and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ACCOUNT_ID: 6c8ccd6aface937ab5dabef61cb64534
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" || { echo "Unexpected Cloudflare account"; exit 1; }
          grep -Fq 'name = "steep-glitter-b5cddiscord-ai-relay-lab"' wrangler.toml || exit 1
      - name: Deploy (requires explicit workflow confirmation)
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
